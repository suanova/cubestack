---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: devenvironments.ai.cubestack.io
spec:
  group: ai.cubestack.io
  names:
    kind: DevEnvironment
    listKind: DevEnvironmentList
    plural: devenvironments
    singular: devenvironment
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DevEnvironment is the Schema for the devenvironments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DevEnvironment
            properties:
              image:
                description: |-
                  Image is the development image, pulled from any accessible container
                  image registry.
                minLength: 1
                type: string
              lifecycle:
                description: Lifecycle configures the lifecycle.
                properties:
                  idleTimeout:
                    default: 0
                    description: IdleTimeout is the idle auto-shutdown timeout in
                      seconds; 0 disables it.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              network:
                description: Network configures the network.
                properties:
                  rdmaEnabled:
                    default: false
                    description: RDMAEnabled enables the RDMA network (Multus).
                    type: boolean
                  rdmaType:
                    default: roce
                    description: |-
                      RDMAType is the RDMA network type: infiniband (requires IB switches) /
                      roce (RoCEv2, reuses lossless ethernet); effective when rdmaEnabled=true.
                    enum:
                    - infiniband
                    - roce
                    type: string
                type: object
              ports:
                description: Ports are extra application ports.
                items:
                  description: PortSpec is an extra application port.
                  properties:
                    containerPort:
                      description: ContainerPort is the in-container application port.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    name:
                      description: Name is the port identifier (unique, used for sub
                        path / status display).
                      minLength: 1
                      type: string
                    type:
                      default: http
                      description: |-
                        Type is the exposure form: http (web over sub path) / tcp (port range +
                        TCPRoute) / udp (UDPRoute).
                      enum:
                      - http
                      - tcp
                      - udp
                      type: string
                  required:
                  - containerPort
                  - name
                  type: object
                type: array
              resources:
                description: Resources is the compute / resource configuration.
                properties:
                  cpu:
                    description: CPU is the CPU limit in cores.
                    type: string
                  gpuCount:
                    default: 1
                    description: GPUCount is the number of GPU cards.
                    format: int32
                    minimum: 1
                    type: integer
                  gpuType:
                    default: nvidia
                    description: |-
                      GPUType is the GPU vendor: nvidia / metax. It decides the GPU extended
                      resource (nvidia.com/gpu / metax-tech.com/gpu) and image brand matching.
                    enum:
                    - nvidia
                    - metax
                    type: string
                  memory:
                    description: Memory is the memory limit.
                    type: string
                type: object
              running:
                default: false
                description: 'Running is the desired running state: true=Running,
                  false=Stopped.'
                type: boolean
              runtime:
                description: Runtime customizes the container runtime.
                properties:
                  args:
                    description: Args overrides the startup arguments.
                    items:
                      type: string
                    type: array
                  command:
                    description: Command overrides the startup command.
                    items:
                      type: string
                    type: array
                  env:
                    description: 'Env is the environment variables (name/value or
                      valueFrom: secretKeyRef).'
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  securityContext:
                    description: |-
                      SecurityContext controls the container user: non-root by default
                      (runAsUser=1000); set runAsUser=0 to run as root. The controller enforces
                      the non-root default and injects any capabilities the environment needs
                      (e.g. RDMA); capability and privileged settings are not user-settable.
                    properties:
                      runAsGroup:
                        description: RunAsGroup is the group ID to run the container
                          as.
                        format: int64
                        type: integer
                      runAsUser:
                        description: |-
                          RunAsUser is the user ID to run the container as. Non-root by default;
                          set 0 to run as root.
                        format: int64
                        type: integer
                    type: object
                type: object
              ssh:
                description: SSH configures SSH access.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled exposes SSH access to the environment: the controller opens the
                      SSH endpoint. It does not start an sshd server — SSH only works if the
                      image itself runs one. The ssh container type always has SSH exposed.
                    type: boolean
                  keysSecret:
                    description: |-
                      KeysSecret is the SSH public key Secret reference. If specified, the
                      controller uses the provided Secret (Secret.data[key] holds multi-line
                      public keys, i.e. authorized_keys content); otherwise the controller
                      generates and manages one. The plaintext is never stored in spec.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              storage:
                description: |-
                  Storage is the workspace storage: a PVC created with the environment and
                  mounted at the workspace path (default /workspace). Omit it to avoid
                  creating a managed workspace PVC; to use an existing PVC as the workspace,
                  mount it via spec.volumes at the workspace path (e.g. /workspace).
                properties:
                  mountPath:
                    default: /workspace
                    description: |-
                      MountPath is the path where the workspace PVC is mounted; defaults to
                      /workspace. The platform's base images set the container home/working
                      directory to this path, so user data persists across restarts. Custom
                      images must either align their home to this path or override mountPath
                      with the image's home directory.
                    type: string
                  pvcRetention:
                    default: retain
                    description: |-
                      PVCRetention is the workspace PVC retention policy, applied only when the
                      environment is deleted. Stopping the environment does not delete the PVC:
                      stopping scales the workload to zero but the workspace data survives
                      stop/start regardless of this field.
                      retain=keep the PVC (default, prevents accidental data loss on deletion)
                      / delete=remove the PVC together with the environment.
                    enum:
                    - retain
                    - delete
                    type: string
                  size:
                    default: 10Gi
                    description: Size is the workspace PVC capacity.
                    type: string
                  storageClassName:
                    description: |-
                      StorageClassName is the workspace storage class. The workspace PVC is
                      created with an access mode compatible with this class (ReadWriteOnce by
                      default).
                    type: string
                type: object
              type:
                default: ssh
                description: |-
                  Type is the container type (single choice): jupyter / ssh / vscode.
                  It decides the container main entry and the image.
                enum:
                - jupyter
                - ssh
                - vscode
                type: string
              volumes:
                description: |-
                  Volumes are data volume mounts referencing existing PVCs. If spec.storage
                  is omitted, mount an existing PVC at the workspace path (e.g. /workspace)
                  to use it as the environment's workspace.
                items:
                  description: VolumeMount is a data volume mount referencing an existing
                    PVC.
                  properties:
                    mountPath:
                      description: MountPath is the mount path (e.g. /data, /models).
                      minLength: 1
                      type: string
                    name:
                      description: Name is the volume identifier.
                      minLength: 1
                      type: string
                    pvcName:
                      description: PVCName is the name of the referenced existing
                        PVC.
                      minLength: 1
                      type: string
                    readOnly:
                      description: ReadOnly indicates whether the volume is read-only
                        (default false).
                      type: boolean
                    subPath:
                      description: SubPath is the sub path (optional).
                      type: string
                  required:
                  - mountPath
                  - name
                  - pvcName
                  type: object
                type: array
            required:
            - image
            - resources
            type: object
          status:
            description: status defines the observed state of DevEnvironment
            properties:
              conditions:
                description: |-
                  Conditions: PodScheduled / StorageReady / BrandMatchValid / Ready (type
                  constants below).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                description: |-
                  Endpoints are the access addresses of the environment: the web (Jupyter)
                  URL, the SSH address, and any extra application port exposures.
                items:
                  description: |-
                    Endpoint describes an access address of the environment: the web (Jupyter)
                    URL, the SSH address, or an extra application port exposure.
                  properties:
                    address:
                      description: |-
                        Address is the access address: a URL for web (e.g.
                        http://<gw-ip>:80/dev/<ns>/<env>/), or a host:port for SSH and tcp/udp
                        ports (e.g. ssh://user@<gw-ip>:<port>).
                      type: string
                    name:
                      description: |-
                        Name identifies the endpoint: "jupyter", "ssh", or the spec.ports[].name
                        for an extra application port.
                      type: string
                  required:
                  - address
                  - name
                  type: object
                type: array
              lastActivityTime:
                description: |-
                  LastActivityTime is the last activity time, used for idle timeout
                  determination.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the most recent spec the
                  controller has reconciled. If it is less than metadata.generation, the
                  status may be stale.
                format: int64
                type: integer
              phase:
                description: Phase describes the current running phase.
                properties:
                  lastTransitionTime:
                    description: LastTransitionTime is the time the current phase
                      was reached.
                    format: date-time
                    type: string
                  name:
                    description: Name is the current phase.
                    enum:
                    - Pending
                    - Running
                    - Stopped
                    - Failed
                    - Terminating
                    type: string
                  reason:
                    description: Reason explains the current phase, e.g. the error
                      when Failed.
                    type: string
                required:
                - name
                type: object
              sshKeysSecret:
                description: |-
                  SSHKeysSecret is the Secret holding the SSH keys in use: the user-provided
                  one from spec.ssh.keysSecret, or a controller-generated one. It is
                  recorded in status so the user can retrieve generated keys.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
