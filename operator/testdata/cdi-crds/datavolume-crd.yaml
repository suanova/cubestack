# A minimal DataVolume CRD (CDI), for envtest only.
#
# The VMImage controller writes a DataVolume's spec and reads status.phase,
# status.progress and status.conditions, and the environment controller
# (#514) will do the same. The real CRD is not vendored: it belongs to CDI,
# not to this project, and pinning a whole CDI API version here would tie the
# test suite to a CDI release the operator does not otherwise depend on.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datavolumes.cdi.kubevirt.io
spec:
  group: cdi.kubevirt.io
  scope: Namespaced
  names:
    kind: DataVolume
    listKind: DataVolumeList
    plural: datavolumes
    singular: datavolume
    shortNames:
      - dv
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
