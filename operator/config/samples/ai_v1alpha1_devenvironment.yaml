apiVersion: ai.cubestack.io/v1alpha1
kind: DevEnvironment
metadata:
  name: dev-llm-alice
  namespace: project-llm
spec:
  # Core (flat) fields
  type: jupyter                # container type: jupyter / ssh / vscode
  image: harbor.local/ai-images/base-cuda:11.8-pytorch2.2
  running: true                # desired running state

  # Compute / resources
  resources:
    gpuType: nvidia
    # gpuCount is the number of GPU cards. Omit it for the default of 1 — an
    # omitted count always means one GPU. Set it to 0 for a CPU-only
    # environment: the pod then carries no GPU resource at all, and the image
    # brand is not checked, which is how the CPU images (ssh-ubuntu22.04,
    # jupyter-minimal) are used.
    gpuCount: 1
    cpu: "16"
    memory: "64Gi"

  # Workspace storage
  # The workspace always uses the platform-predefined StorageClass
  # (cephfs-ephemeral, ReadWriteMany) so it can follow the pod on drift; it is
  # not user-selectable.
  storage:
    size: 200Gi
    pvcRetention: retain         # retain / delete
    # mountPath is optional. Left out, the controller derives the workspace path
    # from runtime.user: /home/<user>, /root when running as root (runAsUser 0),
    # else /workspace. Set it to pin a path — e.g. for a bring-your-own image
    # whose home is somewhere else.
    mountPath: /home/ubuntu

  # Extra data volumes (referencing existing PVCs)
  volumes:
    - name: shared-dataset
      pvcName: dataset-llm-shared
      mountPath: /data
      readOnly: true

  # SSH access
  ssh:
    enabled: true                # enable extra SSH for jupyter/vscode types
    keysSecret:
      name: dev-alice-ssh-keys   # Secret.data[keys] holds multi-line public keys (authorized_keys content)
      key: keys

  # Network
  network:
    rdmaEnabled: false
    rdmaType: roce               # infiniband / roce

  # Container runtime customization
  runtime:
    # The account the container runs as — the one the image's sshd serves, and the
    # account the ssh endpoint advertises. Omit it for the platform default "user";
    # set it to the image's own account: "ubuntu" for the self-authored images
    # (ssh-ubuntu22.04, base-cuda, base-maca), "jovyan" for the stock-derived
    # jupyter-minimal (which also needs securityContext.runAsGroup: 100, its stock
    # gid — the platform default is 1000).
    user: ubuntu
    env:
      - name: MODEL_REPO
        value: /models/llama3-8b

  # Lifecycle
  lifecycle:
    idleTimeout: 3600            # auto-shutdown after 1 hour idle
