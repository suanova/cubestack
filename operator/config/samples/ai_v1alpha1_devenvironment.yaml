apiVersion: ai.cubestack.io/v1alpha1
kind: DevEnvironment
metadata:
  name: dev-llm-alice
  namespace: project-llm
spec:
  # Core (flat) fields
  type: jupyter                # container type: jupyter / ssh / vscode
  image: harbor.local/ai-images/cuda-pytorch:26.08
  running: true                # desired running state

  # Compute / resources
  resources:
    # gpu requests accelerators. It is the whole request: how many cards, of
    # which vendor, and optionally which of that vendor's models. Omit the block
    # entirely for a CPU-only environment — the pod then carries no GPU resource
    # at all, and the image brand is not checked, which is how the CPU-only
    # environments on the cpu-pytorch family image are used. There is no count of 0:
    # an absent block is the only way to ask for none.
    gpu:
      vendor: nvidia             # nvidia (nvidia.com/gpu) / metax (metax-tech.com/gpu)
      count: 1                   # omit for the default of 1
      # model pins the environment to one model of the vendor above, written the
      # way that vendor advertises it. Left out, any node offering the vendor's
      # accelerator will do. A model written against the wrong vendor names a
      # device no node advertises, and the environment stays Pending.
      # model: H200              # metax models look like MXC550 / MXC500
    cpu: "16"
    memory: "64Gi"

  # Placement. A nodeSelector picks the nodes this environment may run on, by
  # label — a node pool, a zone, a particular machine. Left out, the environment
  # is placed wherever its resources allow.
  #
  # It is one input to placement and not the whole of it. The accelerator the
  # environment asks for already decides which nodes can run it, so a label here
  # that disagrees with the gpu.model above loses to that field: the model is
  # what also names the accelerator the environment requests, and a label
  # cannot. The disagreement is reported on the environment's Accepted condition
  # rather than passed over in silence, so set the model there rather than here.
  #
  # A label no node carries is not an error either — the environment stays
  # Pending, because which nodes a cluster has is not something the spec is
  # wrong about.
  nodeSelector:
    node-pool: gpu-2             # any label the cluster puts on its nodes

  # schedulerName names the scheduler that places this environment's pod, when
  # something other than the cluster's default should. Omitted, the default
  # scheduler places it. It decides who picks the node, not which nodes may be
  # picked: the nodeSelector above and the accelerator the environment asks for
  # travel on the pod either way, and a scheduler that ignores them places the
  # environment where the spec did not ask for it to be.
  #
  # The name has to be one a scheduler answers to. A name nothing answers to is
  # not an error the environment reports: no scheduler looks at the pod at all,
  # so it stays Pending with nothing but the PodScheduled condition to say it
  # was never placed.
  schedulerName: gpu-scheduler   # any scheduler registered in the cluster

  # Workspace storage
  # The workspace always uses the platform-predefined StorageClass
  # (cephfs-ephemeral, ReadWriteMany) so it can follow the pod on drift; it is
  # not user-selectable.
  storage:
    size: 200Gi
    # pvcRetention decides what happens to the workspace claim when the
    # environment is deleted: delete reclaims it with the environment (default),
    # retain keeps it. Stopping is unaffected either way. A retained claim
    # outlives the environment — nothing garbage-collects it — and is identified
    # by its name (workspace-dev-llm-alice-0) and its
    # ai.cubestack.io/dev-environment label: create an environment with the same
    # name in the same namespace to reuse it, or delete the claim to reclaim the
    # space.
    pvcRetention: retain         # delete / retain
    # mountPath is optional. Left out, the controller derives the workspace path
    # from runtime: HOME from runtime.env when it names an absolute path
    # outright, else /root when running as root (runAsUser 0), else /home/<user>,
    # else /workspace. Set it to pin a path — e.g. for a bring-your-own image
    # whose home is somewhere else.
    mountPath: /home/ubuntu

  # Extra data volumes (referencing existing PVCs)
  volumes:
    - name: shared-dataset
      pvcName: dataset-llm-shared
      mountPath: /data
      readOnly: true

  # SSH access. The controller always mints a per-environment Secret holding an
  # ed25519 host key, mounted at /etc/ssh/ssh_host_ed25519_key — its presence is
  # what enables ssh in the image. In addition it mounts authorized_keys at
  # /run/ssh/authorized_keys, renamed by the volume from the entry it takes:
  # authorizedKeysSecret below when it is set, else id_ed25519.pub from the
  # generated client keypair (whose private half status.sshClientKeySecret then
  # lets the user retrieve, as id_ed25519). That mount is a whole-Secret directory
  # mount rather than a subPath file, so kubelet delivers a rotation to the
  # running container without a restart. An authorizedKeysSecret must carry its
  # keys under the data key its selector names: the entry is mounted into the
  # workload as it is, and a missing entry leaves the container with no keys.
  # Both mount paths are outside the account's home, which the workspace claim may
  # cover and make unwritable; the controller runs an init container that chowns
  # the workspace claim to the container's own user/group so the workspace itself
  # is writable. sshd listens on 2222 in the container and the Service publishes
  # it as 22.
  ssh:
    enabled: true                # enable extra SSH for jupyter/vscode types
    authorizedKeysSecret:
      name: dev-alice-ssh-keys   # the user's own key Secret, mounted into the workload as it is
      key: authorized_keys       # Secret.data[authorized_keys] holds the authorized_keys content

  # Network. An environment can be given RDMA access, per fabric: the cluster
  # advertises devices, and the environment is handed one for the fabric it
  # names. How the platform attaches it — and so what it asks of the node and
  # the namespace — is not part of this API, so the arrangement can change
  # without the environment changing with it.
  #
  # Which device to request is cluster configuration rather than a spec field,
  # so the resource names are the manager's: --rdma-ib-resource and
  # --rdma-roce-resource, defaulting to rdma/ib_shared_devices and
  # rdma/roce_shared_devices. A cluster that advertises other names points the
  # flags at those; one that advertises neither leaves RDMA environments
  # Pending.
  #
  # Whichever fabric, the namespace must admit the privileged Pod Security
  # Standard: registering RDMA memory locks pages, and that capability is
  # outside the Baseline set.
  network:
    rdmaEnabled: false
    # An InfiniBand fabric addresses a device's peers itself; a RoCE fabric
    # derives their addresses from the host's own networking. An environment is
    # reachable only on the fabric it names.
    rdmaType: roce               # infiniband / roce
    # Outbound access is restricted by default: an environment resolves names and
    # reaches nothing, which serves a notebook off its own image and stops an
    # install or a dataset download at the network. An environment that is meant
    # to reach outside the cluster says so here. The failure is easy to misread —
    # an install that cannot reach its index does not raise, and the environment
    # goes on to fail later on a missing import instead.
    #
    # It is a property of this environment, not of its namespace, and it says
    # nothing about inbound traffic: an environment carrying it is no more
    # reachable from outside than one that leaves it out.
    egress:
      unrestricted: false        # true lets the environment reach any destination

  # Container runtime customization
  runtime:
    # The account the container runs as — the one the image's sshd serves, and the
    # account the ssh endpoint advertises. Omit it for the platform default "user";
    # set it to the image's own account: all three family images (cpu-pytorch,
    # cuda-pytorch, maca-pytorch) create "ubuntu" at uid/gid 1000, which is also what
    # the platform default states.
    user: ubuntu
    # Passwordless sudo for that account, so it can install system packages.
    # Off by default: the images include sudo but grant it only when asked.
    # An environment running as root needs no grant. See spec.runtime.sudo.
    # sudo: true
    env:
      - name: MODEL_REPO
        value: /models/llama3-8b

  # Lifecycle
  lifecycle:
    idleTimeout: 3600            # auto-shutdown after 1 hour idle
