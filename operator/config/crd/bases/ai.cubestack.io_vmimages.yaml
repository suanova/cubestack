                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-validations:
                    - message: the claim name must be set
                      rule: size(self.name) > 0
                  registry:
                    description: Registry is a container image holding the disk.
                    minLength: 1
                    type: string
                type: object
            required:
