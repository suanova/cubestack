---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ipclaims.ipam.cubestack.io
spec:
  group: ipam.cubestack.io
  names:
    kind: IPClaim
    listKind: IPClaimList
    plural: ipclaims
    shortNames:
    - ipc
    singular: ipclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef
      name: Pool
      type: string
    - jsonPath: .status.assignedIP
      name: Assigned
      type: string
    - jsonPath: .spec.nad
      name: NAD
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IPClaim is the Schema for the ipclaims API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of IPClaim
            properties:
              allocation:
                description: |-
                  allocation optionally asks for a named address instead of the lowest free
                  one. Absent means Auto. Immutable in practice, like poolRef: a different
                  address is a different claim.
                properties:
                  address:
                    description: |-
                      address is the IPv4 address to claim. Only meaningful, and only allowed, when
                      strategy is Exact. It must lie inside the pool's range, outside its
                      exclusions, and not be held by another claim.
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
                    type: string
                  strategy:
                    default: Auto
                    description: strategy is Auto or Exact.
                    enum:
                    - Auto
                    - Exact
                    type: string
                type: object
                x-kubernetes-validations:
                - message: address may only be set when strategy is Exact
                  rule: '!has(self.address) || self.strategy == ''Exact'''
                - message: strategy Exact requires address
                  rule: self.strategy != 'Exact' || (has(self.address) && size(self.address)
                    > 0)
              nad:
                description: |-
                  nad optionally names the NetworkAttachmentDefinition to mint for this claim,
                  in the IPClaim's own namespace. The generated NAD takes this name verbatim,
                  which is what lets a VM manifest be written before the claim is satisfied —
                  the VM references the NAD by a name it already knows.

                  Omit it for an address-only claim: an address is bound and nothing is created.
                  The referenced pool must carry a nadTemplate, otherwise the claim fails with
                  reason TemplateMissing.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              poolRef:
                description: |-
                  poolRef names the IPPool to claim from. IPPool is cluster-scoped, so this is
                  a bare name with no namespace.

                  Immutable in practice: re-pointing a bound claim would silently release an
                  address its NAD still carries. Changing pools means a new claim.
                minLength: 1
                type: string
            required:
            - poolRef
            type: object
          status:
            description: status defines the observed state of IPClaim
            properties:
              assignedIP:
                description: assignedIP is the address this claim holds, once bound.
                type: string
              blockers:
                description: |-
                  blockers names what stood in the way of the requested address, when the claim
                  asked for a specific one and did not get it.
                items:
                  description: |-
                    Blocker names something standing between a claim and its address.

                    Structured rather than a sentence because the next step for a reader is usually
                    "go and look at that object", and an address or a range is often what they were
                    searching for.
                  properties:
                    address:
                      description: address is the address at issue, when the blocker
                        holds one.
                      type: string
                    kind:
                      description: |-
                        kind is the kind of the object in the way, e.g. "IPClaim" or
                        "NetworkAttachmentDefinition".
                      type: string
                    name:
                      description: name is the blocker's name.
                      type: string
                    namespace:
                      description: namespace is the blocker's namespace. Empty for
                        cluster-scoped objects.
                      type: string
                    range:
                      description: range is the band at issue, when the blocker is
                        a band rather than an address.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              conditions:
                description: |-
                  conditions represent the current state of the IPClaim resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Condition types set here:
                  - "Ready": True once an address is assigned and, if spec.nad was set, its NAD exists.
                    The cause of a False goes in the condition's reason -- "PoolNotFound",
                    "NamespaceNotAllowed", "RangeInvalid", "RangeExhausted", "TemplateMissing",
                    "NADNotOwned", "AddressOutOfRange", "AddressExcluded", "AddressUnavailable",
                    "ExactNotAllowed", "AllocationInvalid" -- rather than into a condition type of
                    its own.
                  - "DuplicateAddress": written by the audit sweep when this claim shares its
                    address with another claim on the same subnet. A separate type because a
                    different writer owns it; removed by the next sweep that finds nothing.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
