---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: inferenceservices.ai.cubestack.io
spec:
  group: ai.cubestack.io
  names:
    kind: InferenceService
    listKind: InferenceServiceList
    plural: inferenceservices
    singular: inferenceservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelRef
      name: Model
      type: string
    - jsonPath: .spec.profileRef
      name: Profile
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: InferenceService is the Schema for the inferenceservices API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of InferenceService
            properties:
              modelRef:
                description: |-
                  ModelRef references the ModelVersion to serve. The ModelVersion spec is
                  immutable, so changing this field switches the model version for
                  upgrade or rollback.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              overrides:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Overrides provides user values for the parameters declared by the
                  Profile's overrides[]. Unknown keys or invalid values are rejected by
                  the controller at reconcile time.
                type: object
              profileRef:
                description: |-
                  ProfileRef references the InferenceRuntimeProfile to use. The Profile
                  spec is immutable, so changing this field switches the runtime
                  configuration version for upgrade or rollback.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              route:
                description: Route defines the public gateway route of the service.
                properties:
                  modelName:
                    description: |-
                      ModelName is the public model alias, used to generate the hostname
                      <modelName>.<platform-domain>. It must be a single RFC1123 label.
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  publish:
                    default: false
                    description: |-
                      Publish exposes the service through the gateway; defaults to false.
                      Unpublished services only provide a ClusterIP internal endpoint.
                    type: boolean
                  timeoutSeconds:
                    default: 60
                    description: TimeoutSeconds is the gateway request timeout; defaults
                      to 60.
                    format: int64
                    maximum: 86400
                    minimum: 1
                    type: integer
                type: object
            required:
            - modelRef
            - profileRef
            type: object
          status:
            description: status defines the observed state of InferenceService
            properties:
              assets:
                description: Assets reports the created asset ConfigMaps and their
                  content hashes.
                items:
                  description: |-
                    AssetStatus reports a created asset ConfigMap and its content hash
                    (audit chain).
                  properties:
                    hash:
                      description: Hash is the content hash of the rendered ConfigMap
                        data.
                      type: string
                    name:
                      description: Name is the asset alias, also the rendered ConfigMap
                        name suffix.
                      type: string
                    source:
                      description: Source is the source ConfigMap name in cubestack-system.
                      type: string
                  required:
                  - hash
                  - name
                  - source
                  type: object
                type: array
              conditions:
                description: |-
                  conditions represent the current state of the InferenceService resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include (see conditions.go for the constants):
                  - ConditionResolved: profileRef/modelRef/assets resolve and are compatible
                  - ConditionRendered: overrides are valid and the templates render successfully
                  - ConditionProvisioned: rendered asset ConfigMaps and model PVCs are created
                  - ConditionWorkloadsApplied: desired config is applied to Services and workloads
                  - ConditionEndpointReady: the internal endpoint is actually reachable
                  - ConditionRouteReady: the public route is published (or not requested)
                  - ConditionReady: all roles' workloads and Pods are ready
                  - ConditionProgressing: the controller is still applying the desired config

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint reports the service endpoints.
                properties:
                  internal:
                    description: |-
                      Internal is the internal ClusterIP endpoint, e.g.
                      <isvc>-<role>.<namespace>.svc:8001.
                    type: string
                  public:
                    description: Public is the public gateway endpoint; only present
                      when publish is true.
                    type: string
                required:
                - internal
                type: object
              model:
                description: Model echoes the resolved ModelVersion.
                properties:
                  credentials:
                    description: |-
                      Credentials echoes the synced S3 credentials copy source, only present
                      when the ModelVersion storage strategy is S3 and sets credentialsRef
                      (design §3.3).
                    properties:
                      resourceVersion:
                        description: ResourceVersion is the source Secret resourceVersion
                          the copy was synced from.
                        type: string
                      source:
                        description: Source is the source credentials Secret name
                          in cubestack-system.
                        type: string
                    required:
                    - resourceVersion
                    - source
                    type: object
                  name:
                    description: Name is the model name from the resolved ModelVersion.
                    type: string
                  version:
                    description: Version is the model version from the resolved ModelVersion.
                    type: string
                required:
                - name
                - version
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation the controller has processed; if
                  it is lower than metadata.generation, the status may still correspond
                  to an older spec.
                format: int64
                type: integer
              profile:
                description: Profile echoes the resolved InferenceRuntimeProfile.
                properties:
                  name:
                    description: Name is the resolved profile name.
                    type: string
                  revision:
                    description: |-
                      Revision is the combined hash of the profile spec and asset contents at
                      the last successful apply; the baseline for same-name-recreation detection.
                    type: string
                required:
                - name
                - revision
                type: object
              roles:
                description: Roles reports the resolved topology of each role.
                items:
                  description: RoleStatus reports the resolved topology of one role,
                    for billing and quota.
                  properties:
                    groupSize:
                      description: |-
                        GroupSize is the number of Pods per group; only present for
                        LeaderWorkerSet roles.
                      format: int64
                      type: integer
                    kind:
                      description: Kind is the workload kind of the role.
                      enum:
                      - LeaderWorkerSet
                      - Deployment
                      type: string
                    name:
                      description: Name is the role name.
                      type: string
                    ready:
                      description: Ready summarizes whether the role is ready.
                      type: boolean
                    readyReplicas:
                      description: |-
                        ReadyReplicas is the number of ready instance groups (LeaderWorkerSet)
                        or Pods (Deployment).
                      format: int64
                      type: integer
                    replicas:
                      description: |-
                        Replicas is the desired number of instance groups (LeaderWorkerSet) or
                        Pods (Deployment).
                      format: int64
                      type: integer
                    serviceName:
                      description: ServiceName is the generated Service name, <isvc>-<role>.
                      type: string
                    workloadName:
                      description: WorkloadName is the generated workload name, <isvc>-<role>.
                      type: string
                  required:
                  - kind
                  - name
                  - ready
                  - readyReplicas
                  - replicas
                  - serviceName
                  - workloadName
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
