apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cubestack
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cubestack
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cubestack
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: cubestack
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          # Platform Gateway published InferenceService routes and
          # DevEnvironment ListenerSets attach to — one pair of flags for both
          # controllers. Neither this base nor the helm chart creates that
          # Gateway: the platform owns it, and the namespace below is where the
          # reference shape puts it (test/e2e/assets/gateway.yaml) and where the
          # chart's gateway.namespace defaults. The chart renders both flags
          # from its gateway.* values, so a change here has to be made there
          # too.
          # --gateway-catalog-hostname is intentionally not set: publishing
          # stays off (RouteReady=False, GatewayNotConfigured) until a catalog
          # hostname is added via your overlay, e.g.:
          #   - --gateway-catalog-hostname=ai.example.com
          - --gateway-name=cubestack-gateway
          - --gateway-namespace=envoy-gateway-system
          # DevEnvironment L4 port pool. The helm chart renders these two
          # flags from its l4PortRange.* values instead.
          - --l4-port-range-start=20000
          - --l4-port-range-end=20999
          # Extended resources a DevEnvironment's spec.network requests, as
          # advertised by the cluster's shared RDMA device plugin (whose
          # ConfigMap owns the names). The helm chart renders these two flags
          # from its rdma.* values instead.
          - --rdma-ib-resource=rdma/ib_shared_devices
          - --rdma-roce-resource=rdma/roce_shared_devices
        image: controller:latest
        imagePullPolicy: IfNotPresent
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
