# L1 validation for InferenceService per docs/design/isvc/api.md §3.3:
# - route.modelName is required when route.publish is true (CREATE and UPDATE)
#
# Reference existence (modelRef/profileRef), override values and modelName
# uniqueness are validated by the controller at L2 (Resolved/Rendered/RouteReady).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: inferenceservices-ai-cubestack-io
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["ai.cubestack.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["inferenceservices"]
  validations:
  - expression: "!has(object.spec.route) || object.spec.route.publish != true || has(object.spec.route.modelName)"
    message: "route.modelName is required when route.publish is true"
    reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: inferenceservices-ai-cubestack-io-binding
spec:
  policyName: inferenceservices-ai-cubestack-io
  validationActions: [Deny]
