---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ai.cubestack.io
  resources:
  - inferenceruntimeprofiles
  - inferenceservices
  - modelversions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ai.cubestack.io
  resources:
  - inferenceruntimeprofiles/status
  - inferenceservices/status
  - modelversions/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
