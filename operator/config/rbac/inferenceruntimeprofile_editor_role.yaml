# This rule is not used by the project cubestack itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ai.cubestack.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cubestack
    app.kubernetes.io/managed-by: kustomize
  name: inferenceruntimeprofile-editor-role
rules:
- apiGroups:
  - ai.cubestack.io
  resources:
  - inferenceruntimeprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ai.cubestack.io
  resources:
  - inferenceruntimeprofiles/status
  verbs:
  - get
