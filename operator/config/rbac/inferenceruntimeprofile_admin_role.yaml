# This rule is not used by the project cubestack itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ai.cubestack.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cubestack
    app.kubernetes.io/managed-by: kustomize
  name: inferenceruntimeprofile-admin-role
rules:
- apiGroups:
  - ai.cubestack.io
  resources:
  - inferenceruntimeprofiles
  verbs:
  - '*'
- apiGroups:
  - ai.cubestack.io
  resources:
  - inferenceruntimeprofiles/status
  verbs:
  - get
