# sshd configuration, shared by both DevEnvironment image families.
#
# The ssh login account differs per family (self-authored 'ubuntu', stock-derived
# 'jovyan'), so the account is a placeholder: each Dockerfile substitutes its own
# for @SSH_USER@ at build time (ARG SSH_USER). A non-root sshd can only serve the
# uid it runs as - the container account - so this value must match the image's
# USER. A missed substitution still parses (AllowUsers is a valid keyword and the
# pattern merely matches nobody), so it fails closed rather than loud: sshd denies
# every login and the smoke fails on its login assertion.
#
# The account is a *runtime* fact the image cannot see, and one image serves both
# identities: an environment runs it as the image's own account, or as root when
# the spec asks for it (spec.runtime.securityContext.runAsUser 0). A root sshd can
# serve any account, so root has to be admitted beside the family account rather
# than instead of it - but only where it can be served, since a non-root sshd
# cannot setuid to root. That entry is therefore not in this file at all: the
# entrypoint writes it at startup, from the uid the container is actually running
# as (see common/entrypoint.sh).
#
# "Beside", though, is only what this file says. When the container is root the
# family account is refused anyway, and the line above is not what admits or
# refuses it: docker-stacks leaves its build account locked in /etc/shadow (a
# leading '!'), OpenSSH refuses a locked account, and *only a root sshd can read
# /etc/shadow at all* - so the lock check is one more thing root mode turns on,
# having been skipped throughout the non-root path (getspnam returns nothing to
# uid 1000). Root mode therefore serves root alone, which is the identity it
# advertises. The consequence to keep in mind is that the refusal is docker-stacks'
# and not ours: an image whose build account was unlocked would be served from a
# root environment too, into the image's own /home/$USER, which in root mode is not
# the workspace claim. Read `passwd -S` with care here - it reports both accounts
# as locked and cannot tell you which one sshd will refuse.
#
# That root mode has a second price the image pays rather than this file: a root
# sshd refuses to start without its privilege separation directory ("Missing
# privilege separation directory: /run/sshd"), and refuses it *before* it loads any
# host key, so an image that ships none cannot be served as root at all. A non-root
# sshd skips the check - it runs unprivileged throughout, so it has no privilege to
# separate - which is why the images got by without one. Both Dockerfiles therefore
# create it, root-owned: the directory is a requirement of the root mode, and is
# simply unused by the non-root one.
#
# sshd applies the first-obtained value for each option and the distribution
# sshd_config starts with `Include /etc/ssh/sshd_config.d/*.conf`, so this drop-in
# (lexically the first) overrides the defaults that follow it. AllowUsers is one of
# the few options sshd accumulates instead - `sshd -T` prints one line per entry -
# which is what lets the entrypoint add root from a later file rather than edit
# this one at startup.
#
# Key material is not staged. The operator mounts the host key as a subPath file
# at the standard path below, and the platform authorized_keys as a whole-Secret
# directory mount at /run/ssh, whose items rename the selected entry to
# authorized_keys. Neither path needs a per-family value: the platform keys are
# absolute and outside every home, so the operator's mount does not depend on
# which account an image runs as. Note the two differ in kind: a subPath mount is
# frozen at container start, while an ordinary Secret mount is kept in sync by
# kubelet, which is why a rotated authorized_keys needs no restart (see
# images/README.md).

# Unprivileged port: :22 needs CAP_NET_BIND_SERVICE, which a non-root process
# lacks unless the platform grants it. The Service maps its port 22 to this one.
Port 2222
ListenAddress 0.0.0.0
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile none

# The platform keys are absolute: they are mounted outside the account's home,
# which a workspace claim may cover and which the account may not be able to write
# (see images/README.md).
#
# The second path is the container account's own file, so `ssh-copy-id` keeps
# working beside the platform keys (it writes ~/.ssh/authorized_keys; sshd reads
# every file listed, not just the first, and a missing file is not an error).
# Accepted deliberately: the account that can write it is the one sshd serves (a
# non-root sshd can serve no other) and AllowUsers pins the login account, so a key
# placed there buys a login as the uid that already owns the workspace, not a new
# privilege. StrictModes does not change that — it accepts a key file owned by the
# account doing the reading, which is this one — so 'yes' would not close the path.
AuthorizedKeysFile /run/ssh/authorized_keys %h/.ssh/authorized_keys

# The workspace PVC (the image's $HOME) may not carry modes sshd demands of every
# path component; relax ownership checks.
StrictModes no

# Public-key only. A non-root sshd cannot use PAM.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM no
# Root is served only when the container itself runs as root, and then only by key:
# there is no password authentication to prohibit. Refusing it outright - as this
# file did while every image ran non-root - is what stops a root environment from
# being served at all, since the account sshd runs as is the account it may serve.
# What this file does not do is admit it: that AllowUsers entry is written by the
# entrypoint when the container is root, so an environment that cannot serve root
# does not admit it either - a non-root sshd refuses the login at authentication
# instead of accepting the key and failing at setresuid ("Failed to set uids to 0.").
PermitRootLogin prohibit-password
AllowUsers @SSH_USER@

LogLevel VERBOSE
PrintMotd no

# The session environment, as a placeholder — see @SSH_USER@ above for the mechanism.
#
# sshd's SetEnv *replaces* a session's environment rather than adding to it, and what it
# replaces it with is a PATH compiled into sshd itself. So nothing an image's base
# published reaches an ssh session unless it is named here, and the bases are not alike:
# the stock-derived images inherit docker-stacks' conda-first list, while the vendor-base
# images inherit their vendor's, which is where their whole toolchain is — /opt/maca/*/bin
# and /usr/local/cuda/bin for the tools, and MACA_CLANG_PATH / LD_LIBRARY_PATH / CUDA_HOME
# for the compilers and loader that turn a source tree into something the GPU can run. No
# one list is right for all of them, and only each base knows its own, so the pair list is
# built at build time from the variables the image names: common/sshd/install-dropin.sh
# substitutes the placeholder and fails the build if anything did not resolve.
#
# Keep this to ONE SetEnv line. sshd applies the first-obtained value for each option and
# does not merge repetitions, so a second SetEnv line is silently ignored — which looks
# exactly like a wrong substitution, since the variables just do not arrive. The
# installer checks for that; do not rely on it.
#
# A missed substitution is quiet here, unlike a missed @SSH_USER@: the placeholder text
# would become the value and every session would carry it with nothing downstream
# objecting. Hence the installer, the build-time check, and the smoke's assertion that a
# session's values are the image's own.
SetEnv @SSH_ENV@
