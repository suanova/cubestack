# Default values for cubestack-portal-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Override the base name used for Kubernetes labels (app.kubernetes.io/name).
# The chart name is cubestack-portal-chart; this keeps labels as
# "cubestack-portal" instead.
nameOverride: cubestack-portal

# Image settings
image:
  registry: harbor.isuanova.com
  repository: suanova/cubestack-ui
  # Empty means the chart's appVersion, so a released chart pulls the images
  # released with it. Set a tag to point the chart somewhere else.
  tag: ""
  pullPolicy: Always

# Number of replicas
replicaCount: 1

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ui.cubestack.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Environment variables
env: {}

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Node selector for scheduling
nodeSelector: {}

# Tolerations for scheduling
tolerations: []

# Affinity rules for scheduling
affinity: {}

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  # The portal image runs as the `node` user (UID 1000). K8s cannot verify a
  # non-numeric user (e.g. `USER node`) against runAsNonRoot, so pin the
  # numeric UID explicitly.
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"

# Namespace to install into
namespace: cubestack-system

# Namespace holding the CubePilot operator CRs (AgentTemplate / AgentInstance /
# Skill / Task*). Empty = the target namespace above. Point this at the
# operator's namespace when it differs from the portal's — an empty 配置 page is
# usually this value (the app falls back to "cubestack-system").
operatorNamespace: ""

# CubePilot agent API (chat backend). Empty = derived in-cluster Service DNS:
#   http://cubepilot-api.<operatorNamespace>.svc:8080
# Set it when the API runs elsewhere or the Service is named differently.
agentApiUrl: ""

# AI Gateway: the model catalog (chat tab + 系统默认 model source) and the
# playground chat upstream.
gateway:
  # Base URL, e.g. http://ai-gateway.envoy-gateway-system.svc:18080. Empty =
  # discover the ai-gateway Service in `namespace` (in-cluster: direct DNS).
  # With `token` set, a URL set here must be https:// — a token is never sent
  # to a cleartext URL the operator configured.
  url: ""
  # Namespace the gateway Service lives in. Empty = envoy-gateway-system.
  namespace: ""
  # Bearer token sent as Authorization on every gateway call. Prefer an existing
  # Secret so the token is never rendered from a value file.
  token:
    existingSecret: ""
    existingSecretKey: "token"

# Portal log verbosity: error | warn | info | debug.
# - info (default): one line per API request, plus warnings/errors.
# - debug: adds every cluster/gateway call with its arguments and outcome —
#   use it when a page looks empty (namespace, CRD, RBAC and gateway problems
#   all surface there). Read the lines with:
#     kubectl -n <namespace> logs deploy/<release>-cubestack-portal -f
logLevel: info

# Secrets for sensitive data
secrets:
  # Session secret for UI
  sessionSecret:
    create: true
    # Set to existing secret name if using external secret
    existingSecret: ""
    existingSecretKey: "session-secret"
    # Generate random secret if create is true
    length: 32
  # Portal login credentials. Provide pre-hashed htpasswd content (one
  # `user:bcrypt-hash` line per entry) and the chart creates the Secret:
  #   --set-file secrets.htpasswd.content=/path/to/htpasswd
  # Leave content empty to manage the Secret yourself (external secret store);
  # create it with secretName below.
  htpasswd:
    # Secret name the portal reads (HTPASSWD_SECRET_NAME) and the Role grants
    # get on. Default matches the app's built-in default.
    secretName: cubestack-htpasswd
    # Data key inside the Secret holding the htpasswd file
    # (HTPASSWD_SECRET_KEY).
    key: htpasswd
    content: ""

# Pod disruption budget for HA. Set exactly one of minAvailable / maxUnavailable.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null
