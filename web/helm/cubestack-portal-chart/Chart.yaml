apiVersion: v2
name: cubestack-portal-chart
description: A Helm chart for deploying CubeStack Portal (UI)

type: application

# `version` is a prefix, not a tag: main publishes `<version>-sha<7>` and
# `<version>-latest`, and a `vX.Y.Z` release publishes `X.Y.Z`. CI overrides
# both fields at package time, so this value only matters for a local
# `helm install`.
version: 2.1.0
# The tag the UI image defaults to, so it names a real image tag: `latest` is
# what main publishes and always exists.
appVersion: "latest"

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/keywords: cubestack, portal, ui, web
