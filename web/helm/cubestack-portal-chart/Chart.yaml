apiVersion: v2
name: cubestack-portal-chart
description: A Helm chart for deploying CubeStack Portal (UI)

type: application

version: 2.1.0
# The tag the UI image defaults to, so it names a real image tag. Both fields
# are overridden at package time; keeping them in step names the rolling chart.
# The tag a bare `helm install ./web/helm/cubestack-portal-chart` resolves to. `latest` is what
# main publishes and always exists; CI overrides this at package time
# (a release uses the Git tag), so this only affects local installs.
appVersion: "latest"

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/keywords: cubestack, portal, ui, web
