apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cubestack-portal-chart.deploymentName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
    spec:
      serviceAccountName: {{ include "cubestack-portal-chart.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: ui
        image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        {{- include "cubestack-portal-chart.env" . | nindent 8 }}
        # Pin the app's listening port regardless of any user-provided env.PORT.
        - name: PORT
          value: "3000"
        # Bind the standalone Next.js server to all interfaces.
        - name: HOSTNAME
          value: "0.0.0.0"
        # Point the portal at the namespace where the chart creates the
        # cubestack-htpasswd Secret (the app's built-in default is
        # cubestack-system, which may differ from .Values.namespace).
        - name: HTPASSWD_SECRET_NAMESPACE
          value: {{ .Values.namespace | quote }}
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              {{- if .Values.secrets.sessionSecret.existingSecret }}
              name: {{ .Values.secrets.sessionSecret.existingSecret }}
              key: {{ .Values.secrets.sessionSecret.existingSecretKey }}
              {{- else }}
              name: {{ include "cubestack-portal-chart.fullname" . }}-session-secret
              key: session-secret
              {{- end }}
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      restartPolicy: Always
