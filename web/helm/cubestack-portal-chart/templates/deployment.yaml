apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cubestack-portal-chart.deploymentName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable MUST be 0. Kubernetes' default is 25%, which on a
      # single-replica deployment rounds up to 1 — it permits retiring the only
      # pod before the replacement is ready, and the container needs a moment
      # before it answers (a Next.js standalone server compiles its first route
      # on the first request, which a 1s probe timeout calls a failure). The
      # result is a service with no ready endpoint for tens of seconds on every
      # deploy: a burst of 502s that users work around with port-forward.
      # Zero unavailable forces the new pod to pass its probe first.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
    spec:
      serviceAccountName: {{ include "cubestack-portal-chart.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: ui
        image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        {{- include "cubestack-portal-chart.env" . | nindent 8 }}
        # Pin the app's listening port regardless of any user-provided env.PORT.
        - name: PORT
          value: "3000"
        # Bind the standalone Next.js server to all interfaces.
        - name: HOSTNAME
          value: "0.0.0.0"
        # Point the portal at the namespace where the chart creates the
        # cubestack-htpasswd Secret (the app's built-in default is
        # cubestack-system, which may differ from .Values.namespace).
        - name: HTPASSWD_SECRET_NAMESPACE
          value: {{ .Values.namespace | quote }}
        # Portal log verbosity (error | warn | info | debug).
        - name: CUBESTACK_LOG_LEVEL
          value: {{ .Values.logLevel | quote }}
        # Secret name / data key of the htpasswd file (the chart's defaults match
        # the app's built-in defaults; the Role grants get on this name).
        - name: HTPASSWD_SECRET_NAME
          value: {{ .Values.secrets.htpasswd.secretName | quote }}
        - name: HTPASSWD_SECRET_KEY
          value: {{ .Values.secrets.htpasswd.key | quote }}
        # Namespace holding the operator CRs (tasks + agent tabs). Empty in
        # values means "the target namespace".
        - name: CUBESTACK_TASKS_NAMESPACE
          value: {{ .Values.operatorNamespace | default .Values.namespace | quote }}
        {{- if .Values.agentApiUrl }}
        # CubePilot agent API (chat backend); unset = in-cluster Service DNS.
        - name: CUBESTACK_PILOT_URL
          value: {{ .Values.agentApiUrl | quote }}
        {{- end }}
        {{- if .Values.gateway.url }}
        # AI Gateway base (model catalog / playground chat).
        - name: CUBESTACK_GATEWAT_URL
          value: {{ .Values.gateway.url | quote }}
        {{- end }}
        {{- if .Values.gateway.namespace }}
        # Namespace the AI Gateway Service is discovered in.
        - name: CUBESTACK_GATEWAY_NAMESPACE
          value: {{ .Values.gateway.namespace | quote }}
        {{- end }}
        {{- if .Values.gateway.token.existingSecret }}
        # Bearer token for the gateway, from an existing Secret (never a value).
        - name: CUBESTACK_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.gateway.token.existingSecret | quote }}
              key: {{ .Values.gateway.token.existingSecretKey | quote }}
        {{- end }}
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              {{- if .Values.secrets.sessionSecret.existingSecret }}
              name: {{ .Values.secrets.sessionSecret.existingSecret }}
              key: {{ .Values.secrets.sessionSecret.existingSecretKey }}
              {{- else }}
              name: {{ include "cubestack-portal-chart.fullname" . }}-session-secret
              key: session-secret
              {{- end }}
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          # 1s (the default) is shorter than a cold start's first response, so the
          # probe called a healthy container unready and stretched the rollout
          # window. 3s still fails fast on a genuinely wedged process.
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      restartPolicy: Always
