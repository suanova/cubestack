apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cubestack-portal-chart.brandingConfigMapName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
# Written by the 设置 page: data.logo is a data: URL, data.title and
# data.subtitle are the custom wordmark (absent = built-in defaults). The chart
# creates the object so the Role can grant get/patch on exactly this name; Helm
# does not manage these keys, so upgrades keep the branding.
data: {}
