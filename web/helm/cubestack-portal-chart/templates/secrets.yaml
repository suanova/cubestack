{{- /*
session-secret is the HS256 key every portal replica signs its session cookie
with, so it MUST be stable across renders: the operator re-renders this chart on
every reconcile, and a fresh randAlphaNum per render hands each replica a
different key — in HA the login then succeeds on the pod that minted the cookie
and every later request that lands on another pod is 401.

Precedence (the contract the other charts this operator drives also follow):
  1. secrets.sessionSecret.existingSecret — the admin owns the Secret;
  2. the Secret this chart rendered earlier (lookup) — reused verbatim;
  3. randAlphaNum — first install only.
*/ -}}
{{- $sess := .Values.secrets.sessionSecret -}}
{{- if and $sess.create (not $sess.existingSecret) -}}
{{- $name := printf "%s-session-secret" (include "cubestack-portal-chart.fullname" .) -}}
{{- $ns := .Values.namespace | default .Release.Namespace -}}
{{- $existing := lookup "v1" "Secret" $ns $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "session-secret") }}
  session-secret: {{ index $existing.data "session-secret" | quote }}
  {{- else }}
  session-secret: {{ (randAlphaNum (int $sess.length)) | b64enc | quote }}
  {{- end }}
{{- end }}
