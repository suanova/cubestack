# Portal login credentials (htpasswd).
# Runtime default resolution in web/lib/auth/config.ts:
#   name=cubestack-htpasswd, namespace=cubestack-system, data key=htpasswd
# The portal's ServiceAccount must be able to read this Secret.
#
# WARNING: these are demo credentials (user "admin", password "admin").
# Replace with real credentials before any production use.
apiVersion: v1
kind: Secret
metadata:
  name: cubestack-htpasswd
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
type: Opaque
data:
