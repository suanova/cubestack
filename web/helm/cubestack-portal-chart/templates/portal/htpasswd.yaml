{{- if .Values.secrets.htpasswd.content -}}
# Portal login credentials (htpasswd): one `user:bcrypt-hash` line per entry.
# The portal reads this Secret through the Kubernetes API at runtime; the name
# and data key are the values the deployment passes as HTPASSWD_SECRET_NAME /
# HTPASSWD_SECRET_KEY, and the Role grants get on exactly this name.
#
# Provide credentials at install time as pre-hashed content:
#   helm install my-portal ... --set-file secrets.htpasswd.content=/path/to/htpasswd
# Leave content empty to manage the Secret yourself (e.g. an external secret
# store) — create it with the same name as secrets.htpasswd.secretName.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.htpasswd.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
type: Opaque
data:
  {{ .Values.secrets.htpasswd.key }}: {{ .Values.secrets.htpasswd.content | b64enc | quote }}
{{- end }}
