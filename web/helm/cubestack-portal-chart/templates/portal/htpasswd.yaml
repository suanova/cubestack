{{- if .Values.secrets.htpasswd.content -}}
# Portal login credentials (htpasswd).
# The portal reads this Secret through the Kubernetes API at runtime using
# its built-in defaults (name "cubestack-htpasswd", data key "htpasswd",
# one `user:bcrypt-hash` line per entry), so no extra configuration is needed.
#
# No credentials are bundled with this chart. Provide your own htpasswd
# content at install time, e.g.:
#   helm install my-portal ... --set-file secrets.htpasswd.content=/path/to/htpasswd
apiVersion: v1
kind: Secret
metadata:
  name: cubestack-htpasswd
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
type: Opaque
data:
  htpasswd: {{ .Values.secrets.htpasswd.content | b64enc | quote }}
{{- end }}
