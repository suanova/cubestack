---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cubestack-portal-chart.fullname" . }}-role
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
rules:
  # Read htpasswd secret for authentication
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cubestack-htpasswd"]
    verbs: ["get"]
  # Read operator CRDs for UI APIs
  - apiGroups: ["ai.cubestack.io"]
    resources: ["inferenceservices", "devenvironments", "inferenceruntimeprofiles", "modelversions"]
    verbs: ["get", "list", "watch"]
---
# Cluster-scoped: `namespaces` cannot be read through a namespaced Role, and
# the name carries the release namespace so same-named releases in different
# namespaces do not collide on cluster-scoped resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cubestack-portal-chart.clusterRoleName" . }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
rules:
  # Read namespaces and nodes for UI APIs (cluster-scoped core resources)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  # Discover the AI Gateway Service in envoy-gateway-system (playground model
  # list / chat). Cross-namespace, so it lives here rather than in the
  # release-namespace Role (which would also fail to install before the
  # gateway namespace exists). Best-effort: in-cluster the app also falls back
  # to a well-known gateway DNS name that needs no RBAC, and off-cluster it
  # uses the API-server service proxy (kubeconfig, not this ServiceAccount).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  # Read and write the operator's CRs. Reads are cluster-wide because the UI
  # aggregates them (listClusterCustomObject) and the CRDs are a mix of
  # namespaced and cluster scope. Writes (create/patch/delete) are cluster-wide
  # because the UI creates an environment/service in whichever namespace the
  # user picks, and the portal has no per-user role or namespace scoping —
  # sessions carry only the username (see the chart README, "Authorization
  # model"), so every valid session is effectively a platform admin. Guard the
  # htpasswd credentials as admin credentials. Mutations are HTTP PATCH
  # (JSON-Patch, hence the patch verb; the UI never sends PUT/update).
  # profiles and modelversions stay read-only: the UI never writes them.
  # Task CRs are likewise cluster-wide:
  # their namespace comes from CUBESTACK_TASKS_NAMESPACE and need not be the
  # release namespace. The UI creates tasks and deletes them, and patches
  # spec.state / the manual-run annotation (JSON-Patch, hence the patch verb);
  # taskruns (run reports) and tasktemplates stay read-only.
  - apiGroups: ["ai.cubestack.io"]
    resources: ["inferenceservices", "devenvironments"]
    verbs: ["create", "patch", "delete", "get", "list", "watch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["inferenceruntimeprofiles", "modelversions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["tasks"]
    verbs: ["create", "patch", "delete", "get", "list", "watch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["taskruns", "tasktemplates"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cubestack-portal-chart.fullname" . }}-role-binding
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cubestack-portal-chart.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "cubestack-portal-chart.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cubestack-portal-chart.clusterRoleBindingName" . }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cubestack-portal-chart.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cubestack-portal-chart.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
