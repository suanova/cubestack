{{- $operatorNs := .Values.operatorNamespace | default .Values.namespace -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cubestack-portal-chart.fullname" . }}-role
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
rules:
  # Read the htpasswd Secret for authentication. The name is the chart's
  # secrets.htpasswd.secretName (deployment env HTPASSWD_SECRET_NAME); keep the
  # two in sync when overriding either. The operator CRs need no rule here:
  # the ClusterRole below already grants them cluster-wide.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.secrets.htpasswd.secretName | quote }}]
    verbs: ["get"]
  {{- if eq $operatorNs .Values.namespace }}
  # External-model credentials: adding a keyed model on the config page writes a
  # Secret named llm-<model> in the *operator* namespace (the CR only ever
  # carries a reference). RBAC cannot scope a rule by name prefix, so this is
  # every Secret in the namespace. When operatorNamespace differs, the same rule
  # is installed there instead (see below).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
  {{- end }}
---
# Cluster-scoped: `namespaces` cannot be read through a namespaced Role, and
# the name carries the release namespace so same-named releases in different
# namespaces do not collide on cluster-scoped resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cubestack-portal-chart.clusterRoleName" . }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
rules:
  # Read namespaces and nodes for UI APIs (cluster-scoped core resources)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  # Discover the AI Gateway Service in envoy-gateway-system (playground model
  # list / chat) — list only: in-cluster the app then talks to
  # http://<svc>.<ns>.svc:<port> over DNS, so no services/proxy permission is
  # needed. Cross-namespace, so it lives here rather than in the
  # release-namespace Role (which would also fail to install before the gateway
  # namespace exists). Off-cluster the API-server service proxy is used with the
  # kubeconfig credentials, not this ServiceAccount.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
  # Read and write the operator's CRs. Reads are cluster-wide because the UI
  # aggregates them (listClusterCustomObject) and the CRDs are a mix of
  # namespaced and cluster scope. Writes are cluster-wide because the UI creates
  # an environment/service/task in whichever namespace the user picks, and the
  # portal has no per-user role or namespace scoping — sessions carry only the
  # username (see the chart README, "Authorization model"), so every valid
  # session is effectively a platform admin. Guard the htpasswd credentials as
  # admin credentials. Mutations are HTTP PATCH (JSON-Patch, hence the patch
  # verb; the UI never sends PUT/update) and no status subresource is written.
  #
  # Each verb below maps to a call in the app; unused verbs are deliberately
  # NOT granted (no watch/informer anywhere — add "watch" back with the first
  # informer; nothing deletes inferenceservices; nothing writes agenttemplates,
  # skills, taskruns, tasktemplates or the profiles).
  - apiGroups: ["ai.cubestack.io"]
    resources: ["inferenceservices"]
    verbs: ["create", "get", "list", "patch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["devenvironments"]
    verbs: ["create", "delete", "list", "patch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["inferenceruntimeprofiles", "modelversions"]
    verbs: ["list"]
  # Tasks: created from the UI, toggled / manually triggered by JSON-Patch and
  # deleted; the namespace comes from CUBESTACK_TASKS_NAMESPACE, not the release
  # ns, hence the cluster-wide grant. taskruns (run reports) and tasktemplates
  # are read-only.
  - apiGroups: ["ai.cubestack.io"]
    resources: ["tasks"]
    verbs: ["create", "delete", "get", "list", "patch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["taskruns", "tasktemplates"]
    verbs: ["get", "list"]
  # Agent CRDs (CubePilot agent tab): agentinstances are created on the first
  # config save and patched (selectedModel / userInstructions / confirmPolicy /
  # allowlist / enabledSkills — JSON-Patch, hence the patch verb). The builtin
  # agenttemplate (runtime, model catalog, policy default — the config page also
  # edits its models) and the skills (the agent's tool whitelist) are read-mostly.
  - apiGroups: ["ai.cubestack.io"]
    resources: ["agentinstances"]
    verbs: ["create", "get", "list", "patch"]
  # agenttemplates: read the catalog and edit it — the config page adds / edits /
  # removes external models on the builtin template (JSON-Patch, hence patch).
  - apiGroups: ["ai.cubestack.io"]
    resources: ["agenttemplates"]
    verbs: ["get", "patch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["skills"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cubestack-portal-chart.fullname" . }}-role-binding
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cubestack-portal-chart.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "cubestack-portal-chart.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cubestack-portal-chart.clusterRoleBindingName" . }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cubestack-portal-chart.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cubestack-portal-chart.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- if ne $operatorNs .Values.namespace }}
---
# The operator CRs (and therefore the external-model credential Secrets the
# config page writes) live in a different namespace than the portal: grant the
# Secret access where it is actually needed. The namespace must already exist —
# it does whenever the operator's CRs do.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cubestack-portal-chart.fullname" . }}-operator-role
  namespace: {{ $operatorNs }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cubestack-portal-chart.fullname" . }}-operator-role-binding
  namespace: {{ $operatorNs }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cubestack-portal-chart.fullname" . }}-operator-role
subjects:
  - kind: ServiceAccount
    name: {{ include "cubestack-portal-chart.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
