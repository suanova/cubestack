---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cubestack-portal-chart-role
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
rules:
  # Read htpasswd secret for authentication
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cubestack-htpasswd"]
    verbs: ["get"]
  # Read namespaces for UI APIs
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  # Read operator CRDs for UI APIs
  - apiGroups: ["ai.cubestack.io"]
    resources: ["inferenceservices", "devenvironments", "inferenceruntimeprofiles", "modelversions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cubestack-portal-chart-role-binding
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cubestack-portal-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "cubestack-portal-chart.chart" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cubestack-portal-chart-role
subjects:
  - kind: ServiceAccount
    name: {{ include "cubestack-portal-chart.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
