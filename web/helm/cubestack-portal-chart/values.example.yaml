# Example values for the CubeStack Portal Helm Chart

# Image settings
image:
  registry: harbor.isuanova.com
  repository: suanova/cubestack-ui
  tag: "latest"
  pullPolicy: IfNotPresent

# Number of replicas
replicaCount: 1

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ui.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ui-tls
      hosts:
        - ui.example.com

# Environment variables (the container port is pinned to 3000 via PORT;
# setting env.PORT here is ignored and should be omitted)
env:
  NODE_ENV: production

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Node selector for scheduling
nodeSelector:
  kubernetes.io/os: linux

# Tolerations for scheduling
tolerations: []

# Affinity rules for scheduling
affinity: {}

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

# Pod security context
podSecurityContext:
  # The portal image runs as the `node` user (UID 1000). K8s cannot verify a
  # non-numeric user against runAsNonRoot, so pin the numeric UID explicitly.
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"

# Namespace to install into
namespace: cubestack-system

# Secrets for sensitive data
secrets:
  sessionSecret:
    create: true
    existingSecret: ""
    existingSecretKey: "session-secret"
    length: 32
  # Portal login credentials. Provide your own htpasswd content at install
  # time (--set-file secrets.htpasswd.content=/path/to/htpasswd). The chart
  # creates Secret "cubestack-htpasswd", the portal's built-in default.
  htpasswd:
    content: ""

# Pod disruption budget for HA. Set exactly one of minAvailable / maxUnavailable.
# Disabled here because the example runs a single replica: minAvailable: 1 would
# allow zero voluntary disruptions and block node drains/upgrades.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null
