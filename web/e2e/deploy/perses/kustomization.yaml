apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# Generate the ConfigMaps from the source files below so they never drift from
# the on-disk config/provisioning (the dashboards are too large to inline).
configMapGenerator:
  - name: perses-config
    files:
      - config.yaml
  - name: perses-provisioning
    files:
      - provisioning/project.yaml
      - provisioning/global-datasource.yaml
