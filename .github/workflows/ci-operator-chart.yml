name: CI Operator Chart

# Push-only so the chart publish job never appears in pull request checks —
# same as the operator image workflow. The chart's static content (templates/,
# vap.yaml) is generated from config/ by hack/update-helm-resources.sh, so this
# workflow triggers only on chart-relevant paths: helm/ is the packaged
# content, config/ and hack/ are its generator inputs, the Makefile owns the
# regenerate/package targets, and this workflow file itself is included so a
# workflow-only fix re-triggers a publish. Everything else under operator/ is
# covered by the image and CI workflows.
#
# Two triggers, two kinds of version: a merge to main packages the rolling chart
# as `<Chart.yaml version>-latest`; a `vX.Y.Z` tag packages the release version.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: ci-operator-chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A tag has no diff base, and a release publishes regardless of what changed.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            chart:
              - 'operator/helm/**'
              - 'operator/config/**'
              - 'operator/hack/**'
              - 'operator/Makefile'
              - '.github/workflows/ci-operator-chart.yml'

  build-push-chart:
    # A merge publishes what it changed; a release publishes everything, so the
    # released version does not depend on what changed since the last one.
    #
    # `!cancelled()` is required: a skipped `changes` job skips this one whatever
    # its own condition says. Not `always()`, which is true even for a cancelled
    # run. Quoted because YAML reads a leading `!` as a tag.
    needs: changes
    if: "!cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.chart == 'true')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      # Package via the make target: it regenerates the chart from config/ at
      # HEAD first (helm-resources-update dependency) so the pushed artifact
      # always matches the committed sources — the generator fails loudly on
      # errors — and drops any stale tgz before packaging. The tgz lands next
      # to the chart (helm/cubestack-controller-manager-chart/cubestack-controller-manager-chart-<version>.tgz).
      #
      # A release names itself: the tag becomes both version and appVersion, and
      # appVersion is what the templates resolve images from. A merge packages
      # the rolling chart as <Chart.yaml version>-latest instead, a distinct OCI
      # tag so a later push cannot clobber a released <version>.
      - name: Package the chart
        id: package
        working-directory: operator
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_VERSION}" ]; then
            VERSION="${RELEASE_VERSION}"
            APP_VERSION="${RELEASE_VERSION}"
          else
            VERSION="$(grep '^version:' helm/cubestack-controller-manager-chart/Chart.yaml | awk '{print $2}')-latest"
            APP_VERSION=latest
          fi
          make helm-package HELM_CHART_VERSION="${VERSION}" HELM_CHART_APP_VERSION="${APP_VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      # helm is preinstalled on ubuntu-24.04 runners — no install step needed.
      - name: Log in to Harbor (helm registry)
        working-directory: operator
        env:
          # Pass credentials through the environment, never inline: Harbor
          # robot account names contain a literal '$' (robot$<name>) and
          # passwords may contain any shell metacharacter. Env values bypass
          # shell parsing; only the variable reference is expanded below.
          HARBOR_USERNAME: ${{ vars.CI_BOT_NAME }}
          HARBOR_PASSWORD: ${{ secrets.CI_BOT_PASSWORD }}
        run: |
          set -euo pipefail
          helm registry login harbor.isuanova.com \
            -u "$HARBOR_USERNAME" -p "$HARBOR_PASSWORD"
      # Push the packaged chart as an OCI artifact. The OCI repository name is
      # deliberately the chart name (cubestack-controller-manager-chart), kept distinct
      # from the container image repository cubestack-controller-manager in
      # project suanova — Harbor serves chart-OCI and image artifacts under
      # the same repo name within a project.
      - name: Push chart to Harbor
        working-directory: operator
        env:
          # The version the chart was packaged under -- not read back from
          # Chart.yaml, which carries neither the tag nor the -latest suffix.
          PACKAGED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          helm push "helm/cubestack-controller-manager-chart/cubestack-controller-manager-chart-${PACKAGED_VERSION}.tgz" \
            oci://harbor.isuanova.com/suanova
