name: CI Operator Chart

# Push-only so the chart publish job never appears in pull request checks —
# same as the operator image workflow. The chart's static content (templates/,
# vap.yaml) is generated from config/ by hack/update-helm-resources.sh, so this
# workflow triggers only on chart-relevant paths: helm/ is the packaged
# content, config/ and hack/ are its generator inputs, the Makefile owns the
# regenerate/package targets, and this workflow file itself is included so a
# workflow-only fix re-triggers a publish. Everything else under operator/ is
# covered by the image and CI workflows.
#
# Two triggers, two kinds of version: a merge to main packages the rolling chart
# as `<Chart.yaml version>-latest`; a `vX.Y.Z` tag packages the release version.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: ci-operator-chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A tag has no diff base, and a release publishes regardless of what changed.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            chart:
              - 'operator/helm/**'
              - 'operator/config/**'
              - 'operator/hack/**'
              - 'operator/Makefile'
              - '.github/workflows/ci-operator-chart.yml'

  build-push-chart:
    # A merge publishes what it changed; a release publishes everything, so the
    # released version does not depend on what changed since the last one.
    #
    # `!cancelled()` is required: a skipped `changes` job skips this one whatever
    # its own condition says. Not `always()`, which is true even for a cancelled
    # run. Quoted because YAML reads a leading `!` as a tag.
    needs: changes
    if: "!cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.chart == 'true')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.package.outputs.dev }}
      chart_json: ${{ steps.push.outputs.chart_json }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      # Package via the make target: it regenerates the chart from config/ at
      # HEAD first (helm-resources-update dependency) so the pushed artifact
      # always matches the committed sources — the generator fails loudly on
      # errors — and drops any stale tgz before packaging. The tgz lands next
      # to the chart (helm/cubestack-controller-manager-chart/cubestack-controller-manager-chart-<version>.tgz).
      #
      # A release names itself: the tag becomes both version and appVersion, and
      # appVersion is what the templates resolve images from. A merge packages
      # the rolling chart as <Chart.yaml version>-latest instead, a distinct OCI
      # tag so a later push cannot clobber a released <version>.
      - name: Package the chart
        id: package
        working-directory: operator
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_APP_VERSION: ${{ steps.release.outputs.app-version }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_VERSION}" ]; then
            VERSION="${RELEASE_VERSION}"
            APP_VERSION="${RELEASE_APP_VERSION}"
            echo "dev=false" >> "${GITHUB_OUTPUT}"
          else
            VERSION="$(grep '^version:' helm/cubestack-controller-manager-chart/Chart.yaml | awk '{print $2}')"
            APP_VERSION="v${VERSION}"
            echo "dev=true" >> "${GITHUB_OUTPUT}"
          fi
          make helm-package HELM_CHART_VERSION="${VERSION}" HELM_CHART_APP_VERSION="${APP_VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tgz=helm/cubestack-controller-manager-chart/cubestack-controller-manager-chart-${VERSION}.tgz" >> "${GITHUB_OUTPUT}"
      - name: Log in to Harbor (helm + oras)
        working-directory: operator
        env:
          HARBOR_USERNAME: ${{ vars.CI_BOT_NAME }}
          HARBOR_PASSWORD: ${{ secrets.CI_BOT_PASSWORD }}
        run: |
          set -euo pipefail
          helm registry login harbor.isuanova.com \
            -u "$HARBOR_USERNAME" -p "$HARBOR_PASSWORD"
          printf '%s' "$HARBOR_PASSWORD" | oras login harbor.isuanova.com \
            -u "$HARBOR_USERNAME" --password-stdin
      - name: Push release chart (OCI)
        if: steps.package.outputs.dev != 'true'
        working-directory: operator
        run: |
          set -euo pipefail
          helm push "${{ steps.package.outputs.tgz }}" \
            oci://harbor.isuanova.com/suanova
      - name: Push dev chart with channel tag
        id: push
        if: steps.package.outputs.dev == 'true'
        working-directory: operator
        env:
          CHART_VERSION: ${{ steps.package.outputs.version }}
          CHART_TGZ: ${{ steps.package.outputs.tgz }}
        run: |
          set -euo pipefail
          chart_repo="harbor.isuanova.com/suanova/cubestack-controller-manager-chart"
          chart_channel="sha-${GITHUB_SHA::7}"
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY2'
          import json, os, yaml
          meta = yaml.safe_load(open("helm/cubestack-controller-manager-chart/Chart.yaml"))
          json.dump(meta, open(os.path.join(os.environ["RUNNER_TEMP"], "helm-config.json"), "w"), separators=(",", ":"))
          PY2
          out="$(oras push "${chart_repo}:${chart_channel}" \
            "${CHART_TGZ}:application/vnd.cncf.helm.chart.content.v1.tar+gzip" \
            --config "${RUNNER_TEMP}/helm-config.json:application/vnd.cncf.helm.config.v1+json")"
          manifest_digest="$(printf '%s' "$out" | sed -n 's/^Digest: //p' | tail -1)"
          [ -n "$manifest_digest" ] || { echo "::error::cannot resolve chart manifest digest"; exit 1; }
          tgz_digest="sha256:$(sha256sum "$CHART_TGZ" | awk '{print $1}')"
          jq -nc --arg v "$CHART_VERSION" --arg d "$tgz_digest" --arg m "$manifest_digest" \
            '{version:$v,digest:$d,manifest_digest:$m}' > "${RUNNER_TEMP}/chart.json"
          echo "chart_json=$(cat "${RUNNER_TEMP}/chart.json")" >> "$GITHUB_OUTPUT"

  notify-release:
    needs: build-push-chart
    if: needs.build-push-chart.outputs.dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create an installation token for cubestack-release
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-release
          permission-contents: write
      - name: Dispatch component-built
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHART_JSON: ${{ needs.build-push-chart.outputs.chart_json }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg repo "suanova/cubestack" \
            --arg commit "${GITHUB_SHA}" \
            --arg line "2.1" \
            --arg component "cubestack-controller-manager" \
            --argjson chart "${CHART_JSON}" \
            '{event_type:"component-built",client_payload:{repo:$repo,commit:$commit,line:$line,component:$component,chart:$chart}}')"
          for i in 1 2 3; do
            if printf '%s' "${payload}" | gh api --method POST \
                repos/suanova/cubestack-release/dispatches --input -; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::component-built dispatch failed after 3 attempts"
          exit 1
