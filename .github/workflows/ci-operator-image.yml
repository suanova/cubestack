name: CI Operator Image

# Push-only so the image job never appears in pull request checks. The lint, test
# and e2e checks run in ci-operator.yml on the same push; the make docker-build
# here also validates the operator compiles before anything is pushed.
#
# Two triggers, two kinds of tag: a merge to main publishes this commit's rolling
# tags; a `vX.Y.Z` tag publishes the release version it names.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: ci-operator-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A tag has no diff base, and a release publishes regardless of what changed.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.filter.outputs.operator }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            operator:
              - 'operator/**'
              - 'Makefile'
              - '.github/**'

  build-push-image:
    # A merge publishes what it changed; a release publishes everything, so the
    # released version does not depend on what changed since the last one.
    #
    # `!cancelled()` is required: a skipped `changes` job skips this one whatever
    # its own condition says. Not `always()`, which is true even for a cancelled
    # run. Quoted because YAML reads a leading `!` as a tag.
    needs: changes
    if: "!cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.operator == 'true')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      latest_moved: ${{ steps.publish.outputs.latest_moved }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push images
        id: publish
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          MANAGER=harbor.isuanova.com/suanova/cubestack-controller-manager
          ACTIVITY_AGENT=harbor.isuanova.com/suanova/cubestack-activity-agent
          SHA_TAG="${GITHUB_SHA}"

          # Push the immutable, commit-addressed tags. Safe for any commit that
          # ever landed on main, even if a newer commit now exists.
          #
          # Both images are built here, from one commit and one checkout, and the
          # manager is told which sidecar it is paired with: the commit-addressed
          # reference the agent is tagged with is baked into the manager's binary
          # as well, so an environment asks for the agent built beside its own
          # controller. `latest` is not that reference — a release never moves it,
          # so a manager that asked for it could have no sidecar to pull at all,
          # and on main it names a newer commit than the manager it runs under.
          make -C operator docker-build IMG="${MANAGER}:${SHA_TAG}" \
            ACTIVITY_AGENT_IMAGE="${ACTIVITY_AGENT}:${SHA_TAG}"
          make -C operator docker-push IMG="${MANAGER}:${SHA_TAG}"
          make -C operator docker-build-activity-agent ACTIVITY_AGENT_IMAGE="${ACTIVITY_AGENT}:${SHA_TAG}"
          make -C operator docker-push-activity-agent ACTIVITY_AGENT_IMAGE="${ACTIVITY_AGENT}:${SHA_TAG}"

          # A release publishes the version it names and does not move `latest`,
          # which tracks main.
          #
          # "Is this commit still the head of main" is the wrong question. A later
          # merge that changes nothing under these paths does not make these images
          # newer, and skipping on it would strand `latest` on an older build until
          # some future operator change happened along to move it — the deferral
          # hands the tag to a run that then builds nothing.
          #
          # The question is whether main's copy of what decides these images still
          # matches this commit's: if it does, they are the newest there are and
          # `latest` is theirs to take. The pathspec is the `changes` filter above —
          # the same rule that decided these images are being published at all,
          # which is what keeps the gate from drifting from the trigger.
          #
          # Fetched rather than asked of the API so the answer is the trees
          # themselves, with no cap on how many changed files a comparison will
          # report. The repository is public, so this needs no credentials.
          MOVE_LATEST=false
          if [ -z "${RELEASE_VERSION}" ]; then
            git fetch --no-tags --depth=1 origin main
            if git diff --quiet "${GITHUB_SHA}" FETCH_HEAD -- operator Makefile .github; then
              MOVE_LATEST=true
            else
              echo "Skipping 'latest': a later commit changed what these images are built from"
            fi
          fi

          # Both images take the same tags. A release where one of them carried
          # a version and the other did not would leave an environment running a
          # sidecar from a different commit than its manager, which is the one
          # pairing the controller's version sentinel cannot detect.
          for IMAGE in "${MANAGER}" "${ACTIVITY_AGENT}"; do
            if [ -n "${RELEASE_VERSION}" ]; then
              docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:${RELEASE_VERSION}"
              docker push "${IMAGE}:${RELEASE_VERSION}"
              continue
            fi
            if [ "${MOVE_LATEST}" = "true" ]; then
              docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:latest"
              docker push "${IMAGE}:latest"
            fi
          done
          echo "latest_moved=${MOVE_LATEST}" >> "$GITHUB_OUTPUT"

  notify-installer:
    needs: build-push-image
    if: "!cancelled() && github.ref_type == 'branch' && needs.build-push-image.outputs.latest_moved == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create an installation token for cubestack-installer
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-installer
          permission-contents: write
      - name: Dispatch refresh-latest-offline
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPO: suanova/cubestack
          COMPONENT: operator-image
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg r "${SOURCE_REPO}" --arg c "${COMPONENT}" \
            --arg s "${GITHUB_SHA}" \
            --arg u "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{event_type:"refresh-latest-offline",client_payload:{source_repo:$r,component:$c,sha:$s,run_url:$u}}')"
          for i in 1 2 3; do
            if printf '%s' "${payload}" | gh api --method POST \
                repos/suanova/cubestack-installer/dispatches --input -; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::repository_dispatch failed after 3 attempts"
          exit 1
