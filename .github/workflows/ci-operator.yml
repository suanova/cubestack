name: CI Operator

on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main, 'release-*']

permissions: {}

concurrency:
  group: ci-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.filter.outputs.operator }}
      devenv: ${{ steps.filter.outputs.devenv }}
      build: ${{ steps.select.outputs.build }}
      smoke: ${{ steps.select.outputs.smoke }}
      smoke-groups-json: ${{ steps.select.outputs.smoke-groups-json }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching,
          # and so the action below can diff against a commit that is already here.
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # Only the operator's own paths. Which *images* a change reaches is not a
          # filter here any more: that question has one answer, computed once by
          # images/hack/changed-images.sh for this workflow and ci-images.yml both, and
          # it is not a boolean — the images to smoke are a superset of the images to
          # build, since a change to the smoke harness rebuilds nothing and re-smokes
          # everything. The action below runs it; the image jobs read its two outputs.
          #
          # The e2e pulls the *published* DevEnvironment image, so an edit under images/
          # changes nothing its cluster assertions can see until that commit is
          # published — running the operator suite for it would buy nothing. What does
          # validate the images is images-smoke and images-check below.
          filters: |
            operator:
              - 'operator/**'
              - 'Makefile'
              - '.github/**'
            # The deep DevEnvironment suite is the expensive job: three kind
            # clusters, each with a full operator install, ~15 minutes of CI per
            # PR. It runs on the DevEnvironment's own sources — the API types,
            # the controller, the activity agent it installs, the suite and the
            # harness that gates it — plus the build and CI it needs, and not on
            # a PR that only touches another controller.
            #
            # The manager is one binary and the chart one artifact, so shared
            # code (route.go, podspec.go, apply.go, internal/renderer), a chart
            # template or RBAC change, and a dependency bump land here without
            # matching this filter. The DevEnvironment's own CRD and VAP are
            # named because they are the contract the suite asserts. test-e2e
            # still installs that chart and runs helm-e2e-devenv-verify on every
            # operator change, and is the guard for the rest; this suite is the
            # deep one, so it runs when its own subject moves — on a pull request
            # and on a push to main alike.
            devenv:
              - 'operator/api/v1alpha1/devenvironment*'
              - 'operator/api/v1alpha1/conditions.go'
              - 'operator/config/crd/bases/ai.cubestack.io_devenvironments.yaml'
              - 'operator/config/vap/devenvironment_policy.yaml'
              - 'operator/internal/controller/devenvironment*'
              - 'operator/internal/controller/assets.go'
              - 'operator/internal/activity/**'
              - 'operator/test/e2e/assets/devenvironment.yaml'
              - 'operator/test/e2e/devenv/**'
              - 'operator/test/e2e/devenv_*_test.go'
              - 'operator/test/e2e/e2e_suite_test.go'
              - 'operator/hack/**'
              - 'operator/Makefile'
              - 'operator/Dockerfile*'
              - '.github/actions/**'
              - '.github/workflows/ci-operator.yml'
      - name: Work out which images this change reaches
        id: select
        # Shared with ci-images.yml, which derives its `:latest` gate from the same
        # selection — so the diff base and the two selections are answered in one place
        # rather than in a step here that the publish workflow would have to restate.
        uses: ./.github/actions/changed-images

  lint:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  test:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Running Tests
        run: make test

  images-smoke:
    needs: changes
    # On `main`, a push smokes the tree the pull request already smoked — a squash merge
    # makes them the same tree — and ci-images.yml smokes it a third time just before
    # publishing, so the merge was paying for the same 17 minutes on a second runner.
    # Drop that one. A push to `release-*` is kept: ci-images.yml publishes nothing there,
    # so this is the only acceptance the images on those branches ever get. The PR run is
    # what gates `main`: it feeds the required `result` check below, which a skipped need
    # does not fail.
    #
    # `smoke` is empty exactly when the change reaches no image at all — a docs edit on
    # the image contract, or a change to the selector's fixtures alone — and there is
    # nothing to smoke then. It has to stay a test of the *selection*, not of the JSON
    # below: an `include` that expands to no entries fails the job before any step runs,
    # and the JSON for an empty selection is `[]`, which is not the empty string.
    # ci-images.yml's publish job tests `build` the same way, for the same reason.
    if: >-
      needs.changes.outputs.smoke != '' &&
      (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      # One leg per base image, from the rule: `smoke-groups-json` is the selection `smoke`
      # names, partitioned by the base each image is built on. One image per base ships today,
      # so that is one leg per image; the grouping is kept because the base is the axis a leg
      # is *sized* on, and because two images of one base would resolve the same layers — one
      # leg would build both and unpack that base once, where a leg each would unpack it
      # twice. Two *different* vendor bases never share a leg — MACA unpacks to ~33 GB and
      # CUDA to ~38.6 GB, against the ~31 GB a standard runner has free on /, so one runner
      # cannot hold both. A base the change did not reach has no entry and so no leg at all: a
      # CUDA-only pull request schedules one job rather than three, and a shared path such as
      # images/Makefile schedules all of them.
      #
      # One base failing must not cancel the others, or an in-flight vendor leg — the same
      # reason ci-images.yml's publish matrix gives.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.smoke-groups-json) }}
    # A smoke of the four images then shipping measured 17m02s on one runner, so this only ever
    # fires on something stuck. Each leg is now strictly smaller than the run that number came
    # from, being one image today (and at most the images of one base if a base gains a second),
    # so the bound stays what it was: the job's release, not a deadline a leg should approach. A
    # leg that did reach it is answered by sizing it off `vendor` here, not by a column in the
    # rule.
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reclaim disk space
        # The vendor bases are why this step exists, exactly as on a publishing leg. The CPU
        # image is a fraction of one (`cpu-pytorch` measures well under a gigabyte), so its leg
        # skips the 1m41s. `vendor` is the rule's, carried on the group it sized: one
        # derivation, so a smoke leg and a publish leg cannot come out sized differently.
        if: ${{ matrix.vendor }}
        uses: ./.github/actions/reclaim-disk
      - name: Build and smoke the images this base group reaches
        # Every image is built for linux/amd64 and started as a throwaway container on
        # 127.0.0.1, so this needs neither a cluster nor registry credentials. The e2e
        # exercises the cpu-pytorch image alone and leaves the rest neither built nor pulled
        # (operator/Makefile), so this is the only job that covers them.
        #
        # Only the images the change reaches are built, which is what keeps a CPU-only
        # pull request from paying for a vendor base at all; a change to images/common/**
        # reaches all three, and does so across the three legs above rather than queued on
        # one runner that could not hold two vendor bases at once.
        run: |
          set -euo pipefail

          # One target per image rather than `smoke`, which builds all three: smoke.sh takes
          # one image per invocation, so naming the targets is how a subset is asked for.
          # The names are the selector's vocabulary, which is the Makefile's
          # (`make -C images smoke-cpu-pytorch`), and `matrix.images` is that vocabulary for this
          # leg's base.
          targets=""
          for img in ${{ matrix.images }}; do
            targets="${targets} smoke-${img}"
          done
          make -C images ${targets}

  images-check:
    needs: changes
    # The two assertions images/hack/changed-images.sh rests on: that no Dockerfile reads
    # from a sibling image's directory — which is what makes an image's inputs derivable
    # from a path at all — and that the rule's own fixtures still pass, including the
    # equivalence between the paths that select an image and the pathspec its `:latest`
    # gate diffs against. Neither builds anything, so this job is seconds, not minutes.
    #
    # Gated on the selection rather than on a filter of its own: the rule, its fixtures and
    # the COPY checker are all paths that reach every image, so a change leaving the
    # selection empty reaches none of them and leaves nothing to check.
    if: needs.changes.outputs.build != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check the images' inputs and the selection rule
        run: make -C images check-deps check-select

  test-e2e:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # The happy path is the operator install plus three verifications, ~5m; this
    # is a release for something stuck, not a deadline a step should approach.
    # The conformance suite, which used to run here, is devenv-conformance below.
    timeout-minutes: 30
    env:
      # The install target runs codegen locally so an edited tree is reflected
      # in the cluster. That is redundant here: generate-drift runs the same
      # targets and lint runs the same govet, under the same `changes` filter,
      # in parallel with this job — and this job is the critical path.
      HELM_E2E_CODEGEN: "0"
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Install the latest version of kind
        run: |
          KIND_VERSION=0.32.0
          KIND_SHA256="50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54"
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-$(go env GOARCH)
          echo "${KIND_SHA256}  ./kind" | sha256sum --check --strict
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install the operator via helm into a kind cluster
        # -j2 overlaps helm-e2e-setup (cluster bootstrap) with helm-e2e-images (docker
        # builds and the init image pull). ~160s of this step needs no cluster at all,
        # and the two are joined by helm-e2e-images-load, which waits for both before
        # loading anything — so nothing loads into a cluster that is still being
        # created. The environment's own image is built from this commit by
        # helm-e2e-images and loaded beside them: it is not pulled, because a rename or
        # any other change in the commit under test has no published reference to pull
        # until the merge that publishes it. The codegen targets whose parallel
        # execution would be unsafe are already off in this job (HELM_E2E_CODEGEN=0).
        run: make helm-e2e-install -j2
        working-directory: operator
      - name: Verify CRDs, VAPs and RBAC
        run: make helm-e2e-crd-check
        working-directory: operator
      - name: Run the gpu-less ISVC happy-path verification
        run: make helm-e2e-verify
        working-directory: operator
      - name: Run the DevEnvironment happy-path verification
        run: make helm-e2e-devenv-verify
        working-directory: operator
      - name: Clean up the kind cluster
        if: always()
        run: make helm-e2e-cleanup
        working-directory: operator

  devenv-conformance:
    needs: changes
    # Not `operator`: see the `devenv` filter, which names what this suite is
    # about. A skipped run is a pass for `result` below; test-e2e still covers
    # the happy path for every operator change.
    if: needs.changes.outputs.devenv == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # One shard is the operator install plus one leg of the suite. go test's own
    # -timeout of 60m is the real stop, panicking with a useful message; this is
    # the job's release past that plus the ~5m of work before it.
    timeout-minutes: 90
    env:
      # As in test-e2e: generate-drift runs the same targets under the same
      # `changes` filter, so the install needs no codegen of its own.
      HELM_E2E_CODEGEN: "0"
    strategy:
      # One shard failing must not cancel the other's diagnosis.
      fail-fast: false
      matrix:
        # The suite's three shards, which partition the CPU selection (96, 78
        # and 9 specs today). A case runs in its tier's shard unless it names
        # another — see DEVENV_E2E_PRIORITY in operator/Makefile and
        # devenv.LabelShard. Three clusters rather than one: the suite's
        # namespace is per run, but the environments would share a node, and
        # each leg already needs the whole operator install. p2 is the leg with
        # slack: it holds the last-declared, slowest cases (isolation, idle
        # stop, controller restart) so they do not set the wall time of p1, and
        # family K runs there too, which keeps p0 — the leg the matrix fills —
        # from being the long one.
        priority: [p0, p1, p2]
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Install the latest version of kind
        run: |
          KIND_VERSION=0.32.0
          KIND_SHA256="50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54"
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-$(go env GOARCH)
          echo "${KIND_SHA256}  ./kind" | sha256sum --check --strict
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install the operator via helm into a kind cluster
        # The same install test-e2e runs, for the same -j2 reason: the cluster
        # bootstrap overlaps the docker builds and the init image pull, and the
        # environment's own image is built from this commit rather than pulled.
        run: make helm-e2e-install -j2
        working-directory: operator
      - name: Run the DevEnvironment conformance suite (CPU images, ${{ matrix.priority }})
        # The suite the happy-path verification samples. It runs the image the
        # install loaded rather than a published one; the target passes the two
        # opt-ins that say so — see helm-e2e-devenv-conformance in
        # operator/Makefile. Not allowed to fail: the required `result` check
        # aggregates this job.
        timeout-minutes: 70
        run: make helm-e2e-devenv-conformance DEVENV_E2E_PRIORITY=${{ matrix.priority }}
        working-directory: operator
      - name: Clean up the kind cluster
        if: always()
        run: make helm-e2e-cleanup
        working-directory: operator

  helm-drift:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Check helm resources are in sync
        run: make helm-resources-check
        working-directory: operator

  generate-drift:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Check generated code is in sync
        run: make generate-check
        working-directory: operator

  result:
    needs: [lint, test, images-smoke, images-check, test-e2e, devenv-conformance, helm-drift, generate-drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
