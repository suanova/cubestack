name: CI Operator

on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main, 'release-*']

permissions: {}

concurrency:
  group: ci-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.filter.outputs.operator }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # images/** has its own filter rather than riding on the operator one. The
          # e2e pulls the *published* DevEnvironment image, so an edit under images/
          # changes nothing its cluster assertions can see until that commit is
          # published — running the whole operator suite for it would buy nothing.
          # What does validate the images is images-smoke below, which builds every
          # image and asserts the operator contract against them.
          #
          # Markdown is not a build input — nothing under images/ COPYs or otherwise
          # reads one, the Dockerfiles taking *.sh and *.conf — so a docs edit on the
          # image contract should not pay for the ~72 GB build of six images. The
          # extglob says that directly. The obvious form, listing 'images/**' and then
          # negating with '!images/**/*.md', is a silent no-op: paths-filter combines
          # a rule's patterns with `some`, so a pattern that negates a match cannot
          # subtract the file a positive pattern already matched. `every` would make
          # negation work, but it applies to the whole rule set and would break the
          # operator rule above, whose three patterns a file must not have to satisfy
          # all of. Checked against picomatch with the action's own options
          # ({dot: true}): every *.sh, *.conf, Dockerfile and Makefile under images/
          # still matches at any depth, and *.md does not.
          #
          # The paths here decide what gets smoked before a merge, not what gets
          # published — ci-images.yml's own three filters decide that, by enumerating what
          # reaches a build context instead.
          filters: |
            operator:
              - 'operator/**'
              - 'Makefile'
              - '.github/**'
            images:
              - 'images/**/!(*.md)'

  lint:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  test:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Running Tests
        run: make test

  images-smoke:
    needs: changes
    # On `main`, a push smokes the tree the pull request already smoked — a squash merge
    # makes them the same tree — and ci-images.yml smokes it a third time just before
    # publishing, so the merge was paying for the same 17 minutes on a second runner.
    # Drop that one. A push to `release-*` is kept: ci-images.yml publishes nothing there,
    # so this is the only acceptance the images on those branches ever get. The PR run is
    # what gates `main`: it feeds the required `result` check below, which a skipped need
    # does not fail.
    if: >-
      needs.changes.outputs.images == 'true' &&
      (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # The four CPU-and-Metax images measured 17m02s together; the CUDA pair adds two more
    # builds on a 38.6 GB base, so this is sized to release the runner rather than to be
    # tight, as before.
    timeout-minutes: 60
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reclaim disk space
        uses: ./.github/actions/reclaim-disk
      # Three steps, and the prune between them is the reason for the split. Every image
      # is built for linux/amd64 and started as a throwaway container on 127.0.0.1, so this
      # needs neither a cluster nor registry credentials. The e2e exercises jupyter-minimal
      # alone and leaves the rest neither built nor pulled (operator/Makefile), so this is
      # the only job that covers them.
      #
      # The reclaim above is what makes it fit, and it has to cover one vendor base at a
      # time: the MACA pair is ~33 GB unpacked, the CUDA base 38.6 GB, and the aggregate
      # `make -C images smoke` would want both of them resident on the same / at once. The
      # grouping is the Makefile's own families spelled out, so it cannot drift from what
      # the aggregates mean; keep it equal to `smoke` minus the other family, so a new
      # image cannot join one group's aggregate and no group.
      - name: Build and smoke the CPU and Metax base images
        run: make -C images smoke-ssh smoke-jupyter smoke-maca smoke-ssh-maca
      - name: Drop what that built
        run: |
          # The builder's cache is not the image store's, and `docker image prune` does not
          # reach it: what the MACA pair cached would still be resident under the CUDA base.
          docker image prune -af
          docker builder prune -af
          df -h /
      - name: Build and smoke the CUDA images
        run: make -C images smoke-cuda smoke-ssh-cuda

  test-e2e:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # The install target runs codegen locally so an edited tree is reflected
      # in the cluster. That is redundant here: generate-drift runs the same
      # targets and lint runs the same govet, under the same `changes` filter,
      # in parallel with this job — and this job is the critical path.
      HELM_E2E_CODEGEN: "0"
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Install the latest version of kind
        run: |
          KIND_VERSION=0.32.0
          KIND_SHA256="50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54"
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-$(go env GOARCH)
          echo "${KIND_SHA256}  ./kind" | sha256sum --check --strict
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install the operator via helm into a kind cluster
        # -j2 overlaps helm-e2e-setup (cluster bootstrap) with helm-e2e-images (docker
        # builds and the init image pull). ~160s of this step needs no cluster at all,
        # and the two are joined by helm-e2e-images-load, which waits for both before
        # loading anything — so nothing loads into a cluster that is still being
        # created. The environment's own image is not among them: its pod pulls
        # jupyter-minimal:latest from the platform registry at start. The codegen
        # targets whose parallel execution would be unsafe are already off in this job
        # (HELM_E2E_CODEGEN=0).
        run: make helm-e2e-install -j2
        working-directory: operator
      - name: Verify CRDs, VAPs and RBAC
        run: make helm-e2e-crd-check
        working-directory: operator
      - name: Run the gpu-less ISVC happy-path verification
        run: make helm-e2e-verify
        working-directory: operator
      - name: Run the DevEnvironment happy-path verification
        run: make helm-e2e-devenv-verify
        working-directory: operator
      - name: Clean up the kind cluster
        if: always()
        run: make helm-e2e-cleanup
        working-directory: operator

  helm-drift:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Check helm resources are in sync
        run: make helm-resources-check
        working-directory: operator

  generate-drift:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Check generated code is in sync
        run: make generate-check
        working-directory: operator

  result:
    needs: [lint, test, images-smoke, test-e2e, helm-drift, generate-drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
