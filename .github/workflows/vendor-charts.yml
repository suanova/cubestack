name: Vendor charts into cubestack-operator

# cubestack-operator vendors both of this repo's charts as
# assets/charts/<component>-<pin>.tgz and //go:embed's that directory into the
# operator binary (assets/assets.go), so a running operator installs them with no
# chart network access. The archives are committed there, and nothing refreshed
# them: re-vendoring was a manual step, so the copy in the operator drifts from
# the chart it claims to be.
#
# This workflow closes that loop: a branch push packages the rolling `-latest`
# chart, a v* tag packages the release. A tag maps to release-X.Y (it does not
# record its branch), a branch maps to itself, and a missing operator branch
# falls back to main.
#
# Both charts are covered by one matrixed job rather than two workflow files:
# everything below the packaging step — the App token, the clone, the push, the
# pull request — is identical for both.
#
# The archives are packaged here rather than pulled from Harbor: a tag push
# starts the chart publish and this workflow together.
on:
  push:
    branches: [main, 'release-*']
    tags: ['v*']
    paths:
      # The controller-manager chart is generated from operator/config by
      # hack/update-helm-resources.sh, so a change to any of these moves it;
      # web/helm/ is the portal chart itself.
      - 'operator/helm/**'
      - 'operator/config/**'
      - 'operator/hack/**'
      - 'operator/Makefile'
      - 'web/helm/**'
      # Included so a fix to this workflow re-runs it on the merge that carries it.
      - '.github/workflows/vendor-charts.yml'
  # Not path-filtered, so it always runs — this is how the workflow is exercised
  # on demand. It only becomes dispatchable once it is on the default branch.
  workflow_dispatch:

permissions: {}

jobs:
  vendor:
    runs-on: ubuntu-latest
    # Push triggers are already filtered; only a dispatch needs the ref gate, so
    # a manual run cannot package a feature branch or tag over the rolling chart.
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/release-') ||
        startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Read-only for the GITHUB_TOKEN: it fetches this repo and nothing else.
    # Every write below — branch, pull request — goes through the App token.
    permissions:
      contents: read
    strategy:
      # One chart failing to package must not take the other's pull request with it.
      fail-fast: false
      matrix:
        include:
          - component: cubestack-controller-manager
            order: 30
            chart_dir: operator/helm/cubestack-controller-manager-chart
            # The image repository the chart renders and the preload list names.
            image: cubestack-controller-manager
            # Generated from operator/config/ — see the package step.
            package: make
          - component: cubestack-portal
            order: 90
            chart_dir: web/helm/cubestack-portal-chart
            # The portal chart renders the platform UI image, not a portal image.
            image: cubestack-ui
            package: helm
    # Grouped per component, not per run: the two matrix jobs push different
    # branches and have no business waiting on each other. Not cancelled in
    # favour of a newer run — this workflow pushes a branch and then opens a pull
    # request for it, and a run killed between those two leaves a branch no later
    # run would necessarily come back for.
    concurrency:
      group: vendor-chart-${{ matrix.component }}
      cancel-in-progress: false
      # FIFO and up to 100 pending, so a release tag queued behind a rolling run
      # is not dropped.
      queue: max
    env:
      COMPONENT: ${{ matrix.component }}
      ORDER: ${{ matrix.order }}
      IMAGE: ${{ matrix.image }}
      TARGET_REPO: suanova/cubestack-operator
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Empty on a branch push; the tag without its v on a release.
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      # make helm-package regenerates the chart with bin/kustomize, which the
      # Makefile go-installs on demand — hence Go. The portal chart is packaged
      # by helm alone and needs none of it.
      - name: Setup Go
        if: matrix.package == 'make'
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      # helm is preinstalled on ubuntu-24.04 runners — no install step needed.
      # Package each chart the way its own ci-*-chart.yml packages it for Harbor:
      # the OCI tag is <Chart.yaml version>-latest, and that same string is what
      # the operator pins in its catalog. Both are derived from Chart.yaml, so a
      # version bump needs no edit here.
      - name: Package the chart
        id: package
        env:
          PACKAGE: ${{ matrix.package }}
          CHART_DIR: ${{ matrix.chart_dir }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_APP_VERSION: ${{ steps.release.outputs.app-version }}
        run: |
          set -euo pipefail
          CHART_NAME="$(helm show chart "${CHART_DIR}" | awk '/^name:/{print $2}')"
          test -n "${CHART_NAME}"
          if [ -n "${RELEASE_VERSION}" ]; then
            CATALOG_VERSION="${RELEASE_VERSION}"
            APP_VERSION="${RELEASE_APP_VERSION}"
          else
            CHART_VERSION="$(helm show chart "${CHART_DIR}" | awk '/^version:/{print $2}')"
            test -n "${CHART_VERSION}"
            CATALOG_VERSION="${CHART_VERSION}-latest"
            APP_VERSION=latest
          fi

          if [ "${PACKAGE}" = "make" ]; then
            # The make target, not a bare `helm package`: helm-package depends on
            # helm-resources-update (regenerates templates/ from config/ at HEAD)
            # and helm-crds-sync (copies config/crd/bases into the chart's crds/,
            # which is deliberately not committed). A bare package would ship a
            # stale templates/ and no CRDs at all.
            make -C operator helm-package \
              HELM_CHART_VERSION="${CATALOG_VERSION}" HELM_CHART_APP_VERSION="${APP_VERSION}"
            ARCHIVE="${CHART_DIR}/${CHART_NAME}-${CATALOG_VERSION}.tgz"
          else
            helm package "${CHART_DIR}" \
              --version "${CATALOG_VERSION}" --app-version "${APP_VERSION}" \
              --destination "${RUNNER_TEMP}"
            ARCHIVE="${RUNNER_TEMP}/${CHART_NAME}-${CATALOG_VERSION}.tgz"
          fi

          # Absolute: the re-vendor step reads this from inside the target
          # checkout, where a repo-relative path would resolve to the wrong tree.
          ARCHIVE="$(realpath "${ARCHIVE}")"

          # helm names the archive after the chart's own `name`, so this is the
          # packaged version asserting itself, not a guess. The operator looks the
          # file up as <catalog name>-<pin>.tgz, which is why the copy into the
          # repo below is a rename.
          test -f "${ARCHIVE}"
          packaged_version="$(helm show chart "${ARCHIVE}" | awk '/^version:/{print $2}')"
          test "${packaged_version}" = "${CATALOG_VERSION}"
          echo "catalog-version=${CATALOG_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "app-version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"
      # Scoped to the one repository the token has to write: the operator. The App
      # is installed org-wide, but a token minted for everything it can see would
      # be a needlessly large thing to hold for the length of the job.
      - name: Create an installation token for the bot
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-operator
      - name: Resolve the target branch
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          candidate="$(scripts/vendor-chart-target.sh "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}")"
          if [ "$candidate" != "main" ]; then
            # --include so a transient API failure is not read as a missing branch.
            status="$(gh api --include "repos/${TARGET_REPO}/branches/${candidate}" 2>/dev/null \
              | awk 'NR==1{print $2}')" || true
            case "$status" in
              200) ;;
              404)
                echo "::notice::${TARGET_REPO} has no ${candidate} branch; vendoring to main"
                candidate=main
                ;;
              *)
                echo "::error::cannot check ${TARGET_REPO} branch ${candidate} (HTTP ${status:-none})"
                exit 1
                ;;
            esac
          fi
          echo "branch=${candidate}" >> "${GITHUB_OUTPUT}"
          # main keeps its automation branch so an open PR is refreshed, not orphaned.
          if [ "$candidate" = "main" ]; then
            echo "automation-branch=automation/vendor-${COMPONENT}-chart" >> "${GITHUB_OUTPUT}"
          else
            echo "automation-branch=automation/vendor-${COMPONENT}-chart-${candidate}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Clone the target repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ steps.target.outputs.branch }}
          path: target
          fetch-depth: 1
          # The same token is what the push below authenticates with (checkout
          # keeps it configured for this path), so the branch and the pull request
          # belong to the App rather than to the workflow's GITHUB_TOKEN — which
          # matters for more than attribution: the operator's PR workflows run for
          # an App's pull request and would be suppressed for a GITHUB_TOKEN one.
          token: ${{ steps.app-token.outputs.token }}
      # Read the rolling branch's tip here, before the work below, and lease the
      # push against that value. A lease read immediately before the push always
      # matches whatever is on the branch by then, so it only rejects a push
      # racing inside those few microseconds; read here it is a real
      # precondition, and a commit that lands mid-run stops the push instead of
      # being force-pushed away.
      - name: Record the rolling branch's current tip
        id: branch-tip
        working-directory: target
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.automation-branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          echo "sha=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)" \
            >> "$GITHUB_OUTPUT"
      - name: Re-vendor the archive and its pins
        working-directory: target
        env:
          CATALOG_VERSION: ${{ steps.package.outputs.catalog-version }}
          APP_VERSION: ${{ steps.package.outputs.app-version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          charts="assets/charts"
          catalog="assets/components/${ORDER}-${COMPONENT}.yaml"
          vendored="${charts}/${COMPONENT}-${CATALOG_VERSION}.tgz"

          # Any other archive of this component is one a version bump left behind
          # — and an archive no component pins is exactly what
          # TestCatalogChartsAreVendored fails on. The pattern is deliberately
          # narrow: a component declaring a `crdsChart` keeps a second, paired
          # archive (`<name>-crds-<version>.tgz`) beside this one, and both have
          # to be re-vendored and bumped together. Neither component here has a
          # crdsChart today; one added later needs handling here, not just a
          # wider glob.
          for stale in "${charts}/${COMPONENT}"-[0-9]*.tgz; do
            [ "$stale" = "$vendored" ] || rm -f "$stale"
          done

          # A binary blob rewritten with no content change is unreviewable noise
          # in the pull request, and helm makes that the default: it stamps every
          # tar entry with the time it was packaged (chartutil/save.go), so two
          # packages of identical source are never the same bytes. Compare the
          # unpacked trees — that is the content — and keep the existing archive
          # when they agree.
          if [ -f "$vendored" ]; then
            mkdir -p "$RUNNER_TEMP/new-chart" "$RUNNER_TEMP/old-chart"
            tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/new-chart"
            tar -xzf "$vendored" -C "$RUNNER_TEMP/old-chart"
            if ( cd "$RUNNER_TEMP" && diff -ru old-chart new-chart > chart.diff ); then
              : > "$RUNNER_TEMP/chart.diff"
              echo "The vendored archive already holds this chart; left untouched."
            else
              cp "$ARCHIVE" "$vendored"
            fi
          else
            cp "$ARCHIVE" "$vendored"
          fi

          # The pin is the file name — the renderer resolves
          # charts/<component name>-<pinned version>.tgz — so the two move
          # together, never one without the other. Edited in place, never
          # re-serialized: the catalog file is heavily commented and a YAML
          # round-trip would flatten the whole entry into the diff.
          python3 - "${CATALOG_VERSION}" "$catalog" <<'PY'
          import sys

          version, catalog = sys.argv[1:]

          # The pin in the catalog is what the operator resolves the file name from:
          # the `oci:` block's version, and only that one. `defaultValues:`' children
          # below it sit at the same two-space indent, so a file-wide search for
          # `version:` would eventually match the wrong line.
          with open(catalog) as handle:
              lines = handle.readlines()


          def indent_of(line):
              return len(line) - len(line.lstrip(" "))


          start = next((i for i, l in enumerate(lines) if l.rstrip("\n") == "oci:"), None)
          if start is None:
              sys.exit(f"no oci: block in {catalog}")
          end = next(
              (i for i in range(start + 1, len(lines))
               if lines[i].strip() and indent_of(lines[i]) == 0),
              len(lines),
          )
          pins = [i for i in range(start + 1, end) if lines[i].startswith("  version:")]
          if len(pins) != 1:
              sys.exit(f"expected one version: under oci: in {catalog}, found {len(pins)}")
          lines[pins[0]] = f"  version: {version}\n"
          with open(catalog, "w") as handle:
              handle.writelines(lines)
          PY

          # The operator's preload list must name the images the chart renders;
          # TestOwnImagesArePreloaded checks both directions, so a new appVersion
          # has to move these tags with it.
          preload="test/e2e/images.txt"
          if [ -f "$preload" ]; then
            python3 - "${IMAGE}" "${APP_VERSION}" "$preload" <<'PY'
          import re
          import sys

          image, app_version, path = sys.argv[1:]
          own = re.compile(rf"^(\S*/{re.escape(image)}(?:-[^:\s]+)?):[^\s]+$")
          changed = 0
          with open(path) as handle:
              lines = handle.readlines()
          for i, line in enumerate(lines):
              match = own.match(line.strip())
              if match:
                  lines[i] = f"{match.group(1)}:{app_version}\n"
                  changed += 1
          if app_version != "latest" and changed == 0:
              sys.exit(f"no {image} images found in {path}")
          with open(path, "w") as handle:
              handle.writelines(lines)
          PY
          fi
      - name: Commit and push the branch
        id: commit
        working-directory: target
        env:
          CATALOG_VERSION: ${{ steps.package.outputs.catalog-version }}
          TARGET_BRANCH: ${{ steps.target.outputs.automation-branch }}
          # The branch tip as of before this run's work; empty when the branch
          # does not exist yet, which is the one case the lease has no value for.
          EXPECTED_SHA: ${{ steps.branch-tip.outputs.sha }}
          # Fail rather than hang if the token is not accepted: git's fallback for
          # a rejected credential is to prompt, and there is no one to answer.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # The App's own bot identity, so the commit is attributed to suanova-bot
          # in the operator's history rather than to a stray address. actions/checkout
          # does not set these, and git refuses to commit without them.
          git config user.name 'suanova-bot[bot]'
          git config user.email '5056565+suanova-bot[bot]@users.noreply.github.com'
          git checkout -B "$TARGET_BRANCH"
          # Only the paths this workflow owns: a stray file elsewhere in the
          # checkout is not something to commit.
          git add --all -- assets README.md
          # An older target branch may not carry the preload list.
          if [ -e test/e2e/images.txt ]; then
            git add --all -- test/e2e/images.txt
          fi
          # Nothing staged means the archive and its pins already agree. Read the
          # index rather than `git status`: the one state that leaves no tracked
          # change is a version whose pin was bumped by hand while its archive went
          # unvendored — which is precisely the breakage this workflow exists to
          # repair, and it would show up only as a new, still-untracked file.
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore(charts): vendor ${COMPONENT} ${CATALOG_VERSION}"

          # One rolling branch per component: a later chart change refreshes the
          # pull request that is already open instead of stacking a stale one
          # beside it. The lease is the tip read before this run started work
          # (see "Record the rolling branch's current tip"), not one read here,
          # so a push that lands while this run is in flight is rejected rather
          # than clobbered. It does not preserve a commit already on the branch
          # when the run began: the branch is bot-owned scratch state, re-derived
          # from its target branch on every run, so nothing is meant to accumulate
          # there.
          target_ref="refs/heads/${TARGET_BRANCH}"
          if [ -n "$EXPECTED_SHA" ]; then
            git push --force-with-lease="${target_ref}:${EXPECTED_SHA}" origin "HEAD:${target_ref}"
          else
            git push origin "HEAD:${target_ref}"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or refresh the pull request
        if: steps.commit.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CATALOG_VERSION: ${{ steps.package.outputs.catalog-version }}
          TARGET_BRANCH: ${{ steps.target.outputs.automation-branch }}
          BASE_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          title="chore(charts): vendor ${COMPONENT} ${CATALOG_VERSION}"
          body="${RUNNER_TEMP}/pr-body.md"
          {
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              printf 'The chart was released as `%s`, so re-vendor it.\n\n' \
                "${GITHUB_REF_NAME}"
            else
              printf 'The chart changed on `%s@%s`, so re-vendor it.\n\n' \
                "$GITHUB_REPOSITORY" "${GITHUB_SHA:0:7}"
            fi
            preload_entry=''
            if [ -e test/e2e/images.txt ]; then
              preload_entry='- `test/e2e/images.txt` — the own-image preload tags, which follow the chart appVersion'
            fi
            printf -- '- `assets/charts/%s-%s.tgz` — the archive, packaged from the chart at that commit\n- `assets/components/%s-%s.yaml` — the `oci.version` pin, which is the file name the operator resolves\n%s\n\nOpened by the `suanova-bot` App from [`.github/workflows/vendor-charts.yml`](https://github.com/%s/blob/main/.github/workflows/vendor-charts.yml). The archive is `//go:embed`ed into the operator binary, so it is committed here rather than pulled at reconcile time; merging this fires `publish.yml`, which is what actually puts the new chart in front of clusters.\n' \
              "$COMPONENT" "$CATALOG_VERSION" "$ORDER" "$COMPONENT" "$preload_entry" "$GITHUB_REPOSITORY"
          } > "$body"

          # Helm repacks identical content into different bytes, so a changed
          # archive is otherwise an opaque blob to review. This is what changed.
          if [ -s "$RUNNER_TEMP/chart.diff" ]; then
            {
              printf '\n<details><summary>Chart contents diff</summary>\n\n```diff\n'
              head -100 "$RUNNER_TEMP/chart.diff"
              printf '\n```\n\n</details>\n'
            } >> "$body"
          fi

          existing="$(gh pr list --repo "$TARGET_REPO" --head "$TARGET_BRANCH" \
            --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            # The force-push above has already carried the new commit into the
            # branch, which is all that used to be refreshed. The title and the
            # body name the version and the source commit and carry the chart
            # diff, so a run that left them alone would have the previous
            # version's text describing this run's commit — a reviewer reading
            # the description reads it as the state of the pull request. Rewrite
            # both, the same way the create path writes them.
            gh pr edit "$existing" --repo "$TARGET_REPO" \
              --title "$title" --body-file "$body"
            echo "Refreshed the open pull request #${existing}."
            exit 0
          fi

          gh pr create --repo "$TARGET_REPO" --base "$BASE_BRANCH" --head "$TARGET_BRANCH" \
            --title "$title" --body-file "$body"
