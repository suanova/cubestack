name: CI Images

# Push-only so publishing never appears in pull request checks. The suite that
# validates these images — build and smoke — runs in ci-operator.yml, on pull
# requests too; this workflow is about what a merge publishes.
#
# Two triggers, two kinds of tag: a merge to main publishes a commit-addressed
# tag plus `latest`; a `vX.Y.Z` tag publishes the release version it names.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

# One job per image, chosen by the rule both workflows ask
# (images/hack/changed-images.sh), because the images are independent: no Dockerfile
# reads across them, so a merge that changes only images/jupyter/** cannot change what is
# in the MACA pair. Running one job for several images made every such merge pull the
# 10.5 GiB vendor base on its way to publishing images it could not have altered.
#
# Which images those are is the selection, and the selection is the matrix below: an
# image the merge did not reach has no job here at all, rather than a skipped one. The
# two properties that have to hold across runs, not just within one — the concurrency
# group and the `latest` gate — are per image, and both are below.
jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
      build-json: ${{ steps.select.outputs.build-json }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: the action below diffs the pushed commit against the one before
          # it, which a depth-1 clone does not carry.
          fetch-depth: 0
          persist-credentials: false
      - name: Work out which images this merge reaches
        id: select
        # The action ci-operator.yml asks as well, so the two workflows cannot disagree
        # about what this commit reaches — and, because the gate below is derived from
        # that same answer, cannot disagree with it either.
        #
        # A tag answers with every image, without consulting the rule: a release is not a
        # change, and it publishes whatever moved since the last one.
        uses: ./.github/actions/changed-images

  build-push-image:
    # A merge publishes the images it reaches; a merge that reaches none publishes
    # nothing, which is an empty selection rather than a failure.
    #
    # `!cancelled()` is required: a skipped `changes` job skips this one whatever its own
    # condition says. Not `always()`, which is true even for a cancelled run. Quoted
    # because YAML reads a leading `!` as a tag.
    needs: changes
    if: "!cancelled() && needs.changes.outputs.build != ''"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      # Each image publishes independently — that is what makes these separate jobs — so
      # one leg failing must not cancel the others' publish.
      fail-fast: false
      matrix:
        # The selection, as the combinations these jobs expand from. `include` rather
        # than an `image` vector plus per-image entries: an include entry merges into the
        # combination whose keys it matches and is appended as a new one otherwise, so a
        # per-image entry would duplicate its own leg.
        include: ${{ fromJSON(needs.changes.outputs.build-json) }}
    # A backstop that releases the group, not a tight bound: it cannot tell a wedged push
    # from a slow one, and the one slow push measured here — the vendor base's first-ever
    # upload, at 1.30 MB/s — took 2h25m. So the vendor legs take a bound above that cold
    # case and below the 360-minute default it replaces, and the CPU legs, which never
    # touch that base, take one that releases a runner sooner.
    timeout-minutes: ${{ matrix.vendor && 300 || 60 }}
    # Scoped to the image and so to the ref. Only another run that publishes this same
    # image may cancel it, because only such a run redoes the work it would be cutting
    # off. One group for all four would let a CPU-only merge cancel an in-flight vendor
    # publish, whose tag no later run would then be left to move. An image this commit did
    # not reach has no job here at all, so it cannot be the victim of a cancellation.
    concurrency:
      group: ci-images-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Reclaim disk space
        # The vendor images are why this step exists: each unpacks to tens of GB against
        # the ~31 GB a standard runner has free on /. The CPU pair is a fraction of that
        # (ssh-ubuntu22.04 measures 132 MB), so its legs skip the 1m41s.
        if: ${{ matrix.vendor }}
        uses: ./.github/actions/reclaim-disk
      - name: Smoke the image before publishing it
        # The contract the e2e asserts through the Gateway, against a build of this
        # commit's source. ci-operator.yml runs the same target, but on this push rather
        # than before it, and a merge should not publish an image that fails the
        # assertions the platform depends on.
        #
        # Before `Set up Buildx`, not after: `docker build` then uses the engine's own
        # builder, which holds the image where `docker run` finds it. Against the
        # container builder that step installs, the same build would hold a second copy in
        # the builder's cache. On a vendor leg the engine's builder is also the one the
        # push builds in, so there the ordering is what makes the push a cache hit rather
        # than a second build. Nothing here needs buildx, QEMU or a Harbor login: every
        # base is pulled anonymously and every container is a throwaway on 127.0.0.1.
        run: make -C images smoke-${{ matrix.image }}
      - name: Drop what the smoke built
        # A CPU leg pushes from the container builder `Set up Buildx` installs, which has
        # a store of its own: what the smoke loaded into the engine is space nothing
        # downstream reads. A vendor leg pushes from the engine itself, where the same
        # pruning would throw away the base the smoke pulled and the image it just built —
        # thirty-odd GB, and the second 10.5 GiB pull (measured: 590s) plus the second
        # build it would otherwise cost.
        if: ${{ !matrix.vendor }}
        run: |
          docker image prune -af
          docker builder prune -af
          df -h /
      - name: Set up QEMU
        # PLATFORMS is linux/amd64 plus linux/arm64, so for the CPU pair one of the two is
        # not the runner's own architecture and has to be emulated for the build to
        # finish. The vendor images build MACA_PLATFORM alone — linux/amd64, the runner's
        # own — so they need it not at all.
        if: ${{ !matrix.vendor }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        # A runner's default driver is `docker`, which builds for a single platform, so
        # the CPU pair needs the container driver this installs to build its amd64+arm64
        # index. A vendor leg keeps the default driver deliberately: MACA_PLATFORM is one
        # platform — the runner's own — so the container driver would buy nothing, and it
        # would cost a second copy of the base on the runner, since it builds in a store
        # of its own and could not reuse the layers the smoke's build had just pulled and
        # produced. The default driver does push a single-platform image, and the push
        # then reads those layers back out of the engine's cache instead of rebuilding
        # them (measured on a local engine: the second build reports CACHED).
        if: ${{ !matrix.vendor }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push the image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          TAG="$(git rev-parse --short HEAD)"

          # A release publishes the version it names and does not move `latest`, which
          # tracks main. No commit-addressed tag here either: these are multi-arch
          # indexes, where a second tag costs a second full build.
          if [ -n "${RELEASE_VERSION}" ]; then
            make -C images push-${IMAGE} PUSH_LATEST=0 TAG="${RELEASE_VERSION}"
            exit 0
          fi

          # PUSH_LATEST=0: the mutable tag is moved below, and only if this run's image
          # is still the newest image content on main.
          make -C images push-${IMAGE} PUSH_LATEST=0 TAG="${TAG}"

          # "Is this commit still the head of main" is the wrong question. A later commit
          # that touches nothing under these paths does not make this image newer, and
          # skipping on it would strand :latest on an older build until some future change
          # happened along to move it. The question is whether main's copy of what decides
          # this image still matches this commit's: if it does, this image is the newest
          # there is and :latest is its to take.
          #
          # The pathspec is not written here. It comes from images/hack/changed-images.sh,
          # the same rule that decided this image is being published at all, which is what
          # keeps the gate from drifting from the trigger: a gate wider than the selection
          # withholds a tag that no later run would move, and one narrower moves a tag for
          # a commit that changed nothing this image is built from.
          #
          # Fetched rather than asked of the API so the answer is the trees themselves,
          # with no cap on how many changed files a comparison will report. The repository
          # is public, so this needs no credentials.
          paths=()
          while IFS= read -r path; do paths+=("${path}"); done < <(images/hack/changed-images.sh paths "${IMAGE}")
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet "${GITHUB_SHA}" FETCH_HEAD -- "${paths[@]}"; then
            echo "Skipping 'latest': a later commit changed what this image is built from, whose own run owns the tag"
            exit 0
          fi

          # Repoints the tag at the index pushed above; nothing is rebuilt. RETAG names
          # this image and nothing else: the other three were not pushed here, so asking
          # for them would fail on a manifest that does not exist.
          make -C images retag-latest TAG="${TAG}" RETAG="${IMAGE}"
