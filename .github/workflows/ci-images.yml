name: CI Images

# Push-only so publishing never appears in pull request checks. The suite that
# validates these images — build and smoke — runs in ci-operator.yml, on pull
# requests too; this workflow is about what a merge publishes.
#
# Two triggers, two kinds of tag: a merge to main publishes a commit-addressed
# tag plus `latest`; a `vX.Y.Z` tag publishes the release version it names.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

jobs:
  changes:
    # A tag has no diff base, and a release publishes regardless of what changed.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            images:
              - 'images/**'

  build-push-images:
    # A merge publishes what it changed; a release publishes everything, so the
    # released version does not depend on what changed since the last one.
    #
    # `!cancelled()` is required: a skipped `changes` job skips this one whatever
    # its own condition says. Not `always()`, which is true even for a cancelled
    # run. Quoted because YAML reads a leading `!` as a tag.
    needs: changes
    if: "!cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.images == 'true')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Scoped to the job, not the workflow. A run whose commit does not change
    # images/ skips this job, and a skipped job never enters the group — so it
    # cannot cancel the publish of the images/ commit before it. At workflow scope
    # it could, and that commit's image would be the one that never got published.
    concurrency:
      group: ci-images-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Reclaim disk space
        uses: ./.github/actions/reclaim-disk
      - name: Smoke the images before publishing them
        # The contract the e2e asserts through the Gateway, against a build of this
        # commit's source. ci-operator.yml runs the same target, but on this push
        # rather than before it, and a merge should not publish an image that fails
        # the assertions the platform depends on.
        #
        # Before `Set up Buildx`, not after: `docker build` then uses the engine's
        # own builder, which holds the images where `docker run` finds them — one
        # copy of the MACA images' 33 GB base. Against the container builder that
        # step installs, the same build would hold a second copy in the builder's
        # cache, and two do not fit on a runner. Nothing here needs buildx, QEMU or
        # a Harbor login: every base is pulled anonymously and every container is a
        # throwaway on 127.0.0.1.
        run: make -C images smoke
      - name: Drop what the smoke built
        # The push below builds all four images again, in the buildx builder, whose
        # store is its own — so what the smoke loaded into the engine is 33 GB that
        # nothing downstream reads. Dropping it here is the difference between one
        # copy of the MACA base on this runner and two.
        run: |
          docker image prune -af
          docker builder prune -af
          df -h /
      - name: Set up QEMU
        # PLATFORMS is linux/amd64 plus linux/arm64, so one of the two is not the
        # runner's own architecture and has to be emulated for the build to finish.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        # A runner's default driver is `docker`, which builds for a single platform.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push the images
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$(git rev-parse --short HEAD)"

          # A release publishes the version it names and does not move `latest`,
          # which tracks main. No commit-addressed tag here either: these are
          # multi-arch indexes, where a second tag costs a second full build.
          if [ -n "${RELEASE_VERSION}" ]; then
            make -C images push PUSH_LATEST=0 TAG="${RELEASE_VERSION}"
            exit 0
          fi

          # PUSH_LATEST=0: the mutable tag is moved below, and only if this run's
          # image is still the newest image content on main.
          make -C images push PUSH_LATEST=0 TAG="${TAG}"

          # "Is this commit still the head of main" is the wrong question. A later
          # commit that touches nothing under images/ does not make any image
          # newer, and skipping on it would strand :latest on an older build until
          # some future images/ change happened along to move it. The question is
          # whether main's images/ tree still matches this commit's: if it does,
          # this image is the newest there is and :latest is its to take.
          #
          # Fetched rather than asked of the API so the answer is the trees
          # themselves, with no cap on how many changed files a comparison will
          # report. The repository is public, so this needs no credentials.
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet "${GITHUB_SHA}" FETCH_HEAD -- images/; then
            echo "Skipping 'latest': a later commit changed images/, whose own run owns the tag"
            exit 0
          fi

          # Repoints the tag at the index pushed above; nothing is rebuilt.
          make -C images retag-latest TAG="${TAG}"
