name: CI Images

# Push-only so publishing never appears in pull request checks. The suite that
# validates these images — build and smoke — runs in ci-operator.yml, on pull
# requests too; this workflow is about what a merge publishes.
#
# Two triggers, two kinds of tag: a merge to main publishes a commit-addressed
# tag plus `latest`; a `vX.Y.Z` tag publishes the release version it names.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

# Three jobs, one per family of images, because the families are independent: no
# Dockerfile reads across them, so a merge that changes only the CPU pair cannot
# change what is in either vendor pair. Running one job for all six made every such
# merge pull both 10.5 GiB vendor bases on its way to publishing images it could not
# have altered — and hold both of them unpacked at once, which is the disk the
# ci-operator split exists for.
#
# The split has to hold across runs, not just within one, which is why each family
# carries its own concurrency group and its own `latest` gate below.
jobs:
  changes:
    # A tag has no diff base, and a release publishes regardless of what changed.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      cpu: ${{ steps.filter.outputs.cpu }}
      maca: ${{ steps.filter.outputs.maca }}
      cuda: ${{ steps.filter.outputs.cuda }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # One list per family, holding only the paths that can change what is in that
          # family's images: the directories that reach the build context, which
          # images/.dockerignore re-includes one by one, and the Makefile, which holds
          # the base digests and build args that no Dockerfile names. The two lists are
          # the gate pathspecs below spelled the other way round, and they have to stay
          # that way — see the gate.
          #
          # images/common/** is in all three, because all six Dockerfiles COPY from it. This
          # workflow file is in all three because it is what defines these lists, so a change to
          # the lanes republishes every family.
          #
          # Enumerating the paths also drops the two things under images/ that reach no
          # image at all: the markdown (README.md, AGENTS.md) and hack/. A docs edit on
          # the image contract therefore publishes nothing. There is no `images/**` rule
          # left to subtract them from, which is deliberate — paths-filter combines a
          # rule's patterns with `some`, so a negated entry matches everything outside
          # it rather than narrowing the positive one.
          filters: |
            cpu:
              - 'images/ssh-ubuntu-server/**'
              - 'images/jupyter/**'
              - 'images/common/**'
              - 'images/Makefile'
              - 'images/.dockerignore'
              - '.github/workflows/ci-images.yml'
            maca:
              - 'images/jupyter-maca-pytorch/**'
              - 'images/ssh-maca-pytorch/**'
              - 'images/common/**'
              - 'images/Makefile'
              - 'images/.dockerignore'
              - '.github/workflows/ci-images.yml'
            cuda:
              - 'images/jupyter-cuda-pytorch/**'
              - 'images/ssh-cuda-pytorch/**'
              - 'images/common/**'
              - 'images/Makefile'
              - 'images/.dockerignore'
              - '.github/workflows/ci-images.yml'

  build-push-cpu:
    # A merge publishes this pair when it changed something that can reach it; a
    # release publishes everything, so the released version does not depend on what
    # changed since the last one.
    #
    # `!cancelled()` is required: a skipped `changes` job skips this one whatever
    # its own condition says. Not `always()`, which is true even for a cancelled
    # run. Quoted because YAML reads a leading `!` as a tag.
    needs: changes
    if: "!cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.cpu == 'true')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # A backstop that releases the group, not a tight bound: it cannot tell a wedged
    # push from a slow one, and the one slow push measured here (the vendor base's
    # first-ever upload, at 1.30 MB/s) took 2h25m. This lane never touches that base.
    timeout-minutes: 60
    # Scoped to the job, to the family, and so to the ref. A run whose commit does not
    # change this family skips the job, and a skipped job never enters the group — so
    # it cannot cancel the publish of an earlier commit's images. That is also why the
    # family is in the group name: only another run that publishes this same pair may
    # cancel it, because only such a run redoes the work it would be cutting off. One
    # group for both families would let a CPU-only merge cancel an in-flight vendor
    # publish, whose tag no later run would then be left to move.
    concurrency:
      group: ci-images-cpu-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Reclaim disk space
        uses: ./.github/actions/reclaim-disk
      - name: Smoke the images before publishing them
        # The contract the e2e asserts through the Gateway, against a build of this
        # commit's source. ci-operator.yml runs the same targets, but on this push
        # rather than before it, and a merge should not publish an image that fails
        # the assertions the platform depends on.
        #
        # Two targets rather than `smoke`: smoke.sh takes one image per invocation, so
        # naming several is how a subset is asked for.
        #
        # Before `Set up Buildx`, not after: `docker build` then uses the engine's own
        # builder, which holds the images where `docker run` finds them. Against the
        # container builder that step installs, the same build would hold a second copy
        # in the builder's cache. Nothing here needs buildx, QEMU or a Harbor login:
        # every base is pulled anonymously and every container is a throwaway on
        # 127.0.0.1.
        run: make -C images smoke-ssh smoke-jupyter
      - name: Drop what the smoke built
        # The push below builds both images again, in the buildx builder, whose store
        # is its own — so what the smoke loaded into the engine is space nothing
        # downstream reads.
        run: |
          docker image prune -af
          docker builder prune -af
          df -h /
      - name: Set up QEMU
        # PLATFORMS is linux/amd64 plus linux/arm64, so one of the two is not the
        # runner's own architecture and has to be emulated for the build to finish.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        # A runner's default driver is `docker`, which builds for a single platform.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push the images
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$(git rev-parse --short HEAD)"

          # A release publishes the version it names and does not move `latest`, which
          # tracks main. No commit-addressed tag here either: these are multi-arch
          # indexes, where a second tag costs a second full build.
          if [ -n "${RELEASE_VERSION}" ]; then
            make -C images push-ssh push-jupyter PUSH_LATEST=0 TAG="${RELEASE_VERSION}"
            exit 0
          fi

          # PUSH_LATEST=0: the mutable tag is moved below, and only if this run's image
          # is still the newest image content on main.
          make -C images push-ssh push-jupyter PUSH_LATEST=0 TAG="${TAG}"

          # "Is this commit still the head of main" is the wrong question. A later
          # commit that touches nothing under these paths does not make any of these
          # images newer, and skipping on it would strand :latest on an older build
          # until some future change happened along to move it. The question is whether
          # main's copy of what decides these images still matches this commit's: if it
          # does, this image is the newest there is and :latest is its to take.
          #
          # These paths are the `cpu` filter above and have to stay equal to it. That
          # equality is what makes withholding safe, and a wider pathspec here would
          # break it: a later merge that changed a path only the other family publishes
          # would withhold this family's :latest, and no run of the other family would
          # move it either, since that family's tag is not one it published.
          #
          # Fetched rather than asked of the API so the answer is the trees themselves,
          # with no cap on how many changed files a comparison will report. The
          # repository is public, so this needs no credentials.
          PATHS="images/ssh-ubuntu-server images/jupyter images/common images/Makefile images/.dockerignore .github/workflows/ci-images.yml"
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet "${GITHUB_SHA}" FETCH_HEAD -- ${PATHS}; then
            echo "Skipping 'latest': a later commit changed what these images are built from, whose own run owns the tag"
            exit 0
          fi

          # Repoints the tags at the indexes pushed above; nothing is rebuilt. RETAG
          # names what this run published and nothing else: the MACA tags were not
          # pushed here, so asking for them would fail on a manifest that does not exist.
          make -C images retag-latest TAG="${TAG}" RETAG="ssh jupyter"

  build-push-maca:
    # As above: a merge publishes this pair when it changed something that can reach it,
    # a release publishes everything.
    needs: changes
    if: "!cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.maca == 'true')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # A backstop that releases the group, not a tight bound: it cannot tell a wedged
    # push from a slow one, and the one slow push measured here — this base's
    # first-ever upload, at 1.30 MB/s — took 2h25m. Sized above that cold case and
    # below the 360-minute default it replaces, so it only fires on something stuck.
    timeout-minutes: 300
    # Per family and per ref: only another run that publishes this same pair may cancel
    # it. See the CPU lane for why one group for both families is not equivalent.
    concurrency:
      group: ci-images-maca-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Reclaim disk space
        uses: ./.github/actions/reclaim-disk
      - name: Smoke the images before publishing them
        # As in the CPU lane: the acceptance contract, run against a build of this
        # commit's source before the merge publishes it, ahead of `Set up Buildx` so the
        # engine's own store holds what `docker run` reads.
        run: make -C images smoke-maca smoke-ssh-maca
      - name: Drop what the smoke built
        # The push below builds both images again, in the buildx builder, whose store is
        # its own — so what the smoke loaded into the engine is 33 GB that nothing
        # downstream reads. Dropping it here is the difference between one copy of the
        # vendor base on this runner and two.
        run: |
          docker image prune -af
          docker builder prune -af
          df -h /
      - name: Set up Buildx
        # A runner's default driver is `docker`, which builds for a single platform.
        #
        # No QEMU here, unlike the CPU lane: both of these images are built for
        # MACA_PLATFORM alone, which is linux/amd64 and nothing else.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push the images
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$(git rev-parse --short HEAD)"

          # A release publishes the version it names and does not move `latest`. Both
          # of these publish a single-platform index, so a second tag is a second build
          # for them too.
          if [ -n "${RELEASE_VERSION}" ]; then
            make -C images push-maca push-ssh-maca PUSH_LATEST=0 TAG="${RELEASE_VERSION}"
            exit 0
          fi

          # PUSH_LATEST=0: the mutable tag is moved below, and only if this run's image
          # is still the newest image content on main.
          make -C images push-maca push-ssh-maca PUSH_LATEST=0 TAG="${TAG}"

          # The `maca` filter above, and it has to stay equal to it — see the CPU lane.
          PATHS="images/jupyter-maca-pytorch images/ssh-maca-pytorch images/common images/Makefile images/.dockerignore .github/workflows/ci-images.yml"
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet "${GITHUB_SHA}" FETCH_HEAD -- ${PATHS}; then
            echo "Skipping 'latest': a later commit changed what these images are built from, whose own run owns the tag"
            exit 0
          fi

          # Repoints the tags at the indexes pushed above; nothing is rebuilt.
          make -C images retag-latest TAG="${TAG}" RETAG="maca ssh-maca"

  build-push-cuda:
    # As above: a merge publishes this pair when it changed something that can reach it,
    # a release publishes everything.
    needs: changes
    if: "!cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.cuda == 'true')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # The MACA lane's number, on the same reasoning: a backstop that releases the group
    # rather than a tight bound. This base is a different vendor's and a different size
    # unpacked (38.6 GB against 33), but it is the same 10.5 GiB to upload — measured
    # from the manifest, not assumed — so the one cold push that sized that lane (2h25m
    # at 1.30 MB/s) is the case to clear here too.
    timeout-minutes: 300
    # Per family and per ref: only another run that publishes this same pair may cancel
    # it. See the CPU lane for why one group for all families is not equivalent.
    concurrency:
      group: ci-images-cuda-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Reclaim disk space
        uses: ./.github/actions/reclaim-disk
      - name: Smoke the images before publishing them
        # As in the CPU and MACA lanes: the acceptance contract, run against a build of
        # this commit's source before the merge publishes it, ahead of `Set up Buildx` so
        # the engine's own store holds what `docker run` reads.
        run: make -C images smoke-cuda smoke-ssh-cuda
      - name: Drop what the smoke built
        # The push below builds both images again, in the buildx builder, whose store is
        # its own — so what the smoke loaded into the engine is 39 GB that nothing
        # downstream reads. Dropping it here is the difference between one copy of the
        # vendor base on this runner and two.
        run: |
          docker image prune -af
          docker builder prune -af
          df -h /
      - name: Set up Buildx
        # A runner's default driver is `docker`, which builds for a single platform.
        #
        # No QEMU here, unlike the CPU lane: both of these images are built for
        # CUDA_PLATFORM alone, which is linux/amd64 and nothing else.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push the images
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$(git rev-parse --short HEAD)"

          # A release publishes the version it names and does not move `latest`. Both
          # of these publish a single-platform index, so a second tag is a second build
          # for them too.
          if [ -n "${RELEASE_VERSION}" ]; then
            make -C images push-cuda push-ssh-cuda PUSH_LATEST=0 TAG="${RELEASE_VERSION}"
            exit 0
          fi

          # PUSH_LATEST=0: the mutable tag is moved below, and only if this run's image
          # is still the newest image content on main.
          make -C images push-cuda push-ssh-cuda PUSH_LATEST=0 TAG="${TAG}"

          # The `cuda` filter above, and it has to stay equal to it — see the CPU lane.
          PATHS="images/jupyter-cuda-pytorch images/ssh-cuda-pytorch images/common images/Makefile images/.dockerignore .github/workflows/ci-images.yml"
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet "${GITHUB_SHA}" FETCH_HEAD -- ${PATHS}; then
            echo "Skipping 'latest': a later commit changed what these images are built from, whose own run owns the tag"
            exit 0
          fi

          # Repoints the tags at the indexes pushed above; nothing is rebuilt. RETAG
          # names what this run published and nothing else — the other families' tags
          # were not pushed here, so asking for them would fail on a manifest that does
          # not exist.
          make -C images retag-latest TAG="${TAG}" RETAG="cuda ssh-cuda"
