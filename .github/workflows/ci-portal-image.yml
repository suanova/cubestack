name: CI Portal Image

# Push-only so the image job never appears in pull request checks. The lint and
# build checks run in ci-portal.yml on the same push; docker build here also
# validates the app compiles before anything is pushed.
#
# Two triggers, two kinds of tag: a merge to main publishes this commit's rolling
# tags; a `vX.Y.Z` tag publishes the release version it names.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: ci-portal-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A tag has no diff base, and a release publishes regardless of what changed.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            portal:
              - 'web/**'
              - '.github/**'

  build-push-image:
    # A merge publishes what it changed; a release publishes everything, so the
    # released version does not depend on what changed since the last one.
    #
    # `!cancelled()` is required: a skipped `changes` job skips this one whatever
    # its own condition says. Not `always()`, which is true even for a cancelled
    # run. Quoted because YAML reads a leading `!` as a tag.
    needs: changes
    if: "!cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.portal == 'true')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE=harbor.isuanova.com/suanova/cubestack-ui
          SHA_TAG="${GITHUB_SHA}"

          # Push the immutable, commit-addressed tag. Safe for any commit that
          # ever landed on main, even if a newer commit now exists.
          docker build -t "${IMAGE}:${SHA_TAG}" ./web
          docker push "${IMAGE}:${SHA_TAG}"

          # A release publishes the version it names and does not move `latest`,
          # which tracks main.
          if [ -n "${RELEASE_VERSION}" ]; then
            docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:${RELEASE_VERSION}"
            docker push "${IMAGE}:${RELEASE_VERSION}"
            exit 0
          fi

          # "Is this commit still the head of main" is the wrong question. A later
          # merge that changes nothing under these paths does not make this image
          # newer, and skipping on it would strand `latest` on an older build until
          # some future portal change happened along to move it — the deferral hands
          # the tag to a run that then builds nothing.
          #
          # The question is whether main's copy of what decides this image still
          # matches this commit's: if it does, this image is the newest there is and
          # `latest` is its to take. The pathspec is the `changes` filter above — the
          # same rule that decided this image is being published at all, which is
          # what keeps the gate from drifting from the trigger.
          #
          # Fetched rather than asked of the API so the answer is the trees
          # themselves, with no cap on how many changed files a comparison will
          # report. The repository is public, so this needs no credentials.
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet "${GITHUB_SHA}" FETCH_HEAD -- web .github; then
            echo "Skipping 'latest': a later commit changed what this image is built from"
            exit 0
          fi

          docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
