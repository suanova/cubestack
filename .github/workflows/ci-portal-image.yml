name: CI Portal Image

# Push-only so the image job never appears in pull request checks. The lint and
# build checks run in ci-portal.yml on the same push; docker build here also
# validates the app compiles before anything is pushed.
#
# Two triggers, two kinds of tag: a merge to main publishes this commit's rolling
# tags; a `vX.Y.Z` tag publishes the release version it names.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: ci-portal-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A tag has no diff base, and a release publishes regardless of what changed.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            portal:
              - 'web/**'
              - '.github/**'

  build-push-image:
    # A merge publishes what it changed; a release publishes everything, so the
    # released version does not depend on what changed since the last one.
    #
    # `!cancelled()` is required: a skipped `changes` job skips this one whatever
    # its own condition says. Not `always()`, which is true even for a cancelled
    # run. Quoted because YAML reads a leading `!` as a tag.
    needs: changes
    if: "!cancelled() && (github.ref_type == 'tag' || needs.changes.outputs.portal == 'true')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      images_json: ${{ steps.publish.outputs.images_json }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the release version
        id: release
        uses: ./.github/actions/resolve-release-version
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push image
        id: publish
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_APP_VERSION: ${{ steps.release.outputs.app-version }}
        run: |
          set -euo pipefail
          IMAGE=harbor.isuanova.com/suanova/cubestack-ui
          if [ -n "${RELEASE_VERSION}" ]; then
            SHA_TAG="${GITHUB_SHA}"
          else
            SHA_TAG="${GITHUB_SHA::7}"
          fi

          # Push the immutable, commit-addressed tag. Safe for any commit that
          # ever landed on main, even if a newer commit now exists.
          docker build -t "${IMAGE}:${SHA_TAG}" ./web
          docker push "${IMAGE}:${SHA_TAG}"

          # A release publishes the version it names; main publishes the
          # commit-addressed tag and leaves the digest to the release bumper.
          if [ -n "${RELEASE_VERSION}" ]; then
            docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:${RELEASE_APP_VERSION}"
            docker push "${IMAGE}:${RELEASE_APP_VERSION}"
            exit 0
          fi

          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:${SHA_TAG}" \
            | awk -F@ -v r="${IMAGE}" '$1==r {print $2; exit}')"
          [ -n "${digest}" ] || { echo "::error::cannot resolve digest for ${IMAGE}:${SHA_TAG}"; exit 1; }
          jq -nc --arg n "cubestack-ui" --arg r "${IMAGE}:${SHA_TAG}" --arg d "${digest}" \
            '{name:$n,ref:$r,digest:$d}' > "${RUNNER_TEMP}/images.json"
          echo "images_json=[$(cat "${RUNNER_TEMP}/images.json")]" >> "$GITHUB_OUTPUT"

  notify-release:
    needs: build-push-image
    if: "github.ref_type == 'branch'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create an installation token for cubestack-release
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-release
          permission-contents: write
      - name: Dispatch component-built
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGES_JSON: ${{ needs.build-push-image.outputs.images_json }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg repo "suanova/cubestack" \
            --arg commit "${GITHUB_SHA}" \
            --arg line "2.1" \
            --arg component "cubestack-portal" \
            --argjson images "${IMAGES_JSON}" \
            '{event_type:"component-built",client_payload:{repo:$repo,commit:$commit,line:$line,component:$component,images:$images}}')"
          for i in 1 2 3; do
            if printf '%s' "${payload}" | gh api --method POST \
                repos/suanova/cubestack-release/dispatches --input -; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::component-built dispatch failed after 3 attempts"
          exit 1
