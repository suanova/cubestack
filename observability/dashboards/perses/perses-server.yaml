# Perses server instance, deployed by the perses-operator (installed in the
# `monitoring` namespace). The operator creates the Deployment, Service and
# config in the same namespace as this CR.
#
# The web portal proxies /api/perses/* to this Service — set on the portal:
#   PERSES_SERVER_URL=http://perses.monitoring.svc:8080
apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
    name: perses
    namespace: monitoring
spec:
    # Pinned to the portal's @perses-dev/* client version (0.54.0) so the
    # served plugin bundles and the REST API stay compatible. Bump both
    # together (see web/e2e/deploy/perses/README.md). Mirrored in the cluster
    # registry because the nodes cannot reach docker.io.
    image: harbor.isuanova.com/suanova/perses:v0.54.0
    # File-based storage (emptyDir): no external DB. Dashboards and datasources
    # are re-synced from the PersesDashboard / PersesGlobalDatasource CRs by
    # the operator, so losing the file DB on pod restart is harmless.
    config:
        database:
            file:
                folder: /perses
# The PersesDashboard resources live in the `monitoring` namespace: the
# operator maps Kubernetes namespaces to Perses projects, so they sync into
# project `monitoring`. The portal is built with
# NEXT_PUBLIC_PERSES_PROJECT=monitoring to match (web/lib/perses/config.ts);
# if you move the dashboards to another namespace, rebuild the portal with
# the matching project name.
