kind: Dashboard
metadata:
    name: resource-overview-dashboard
    version: 0
    project: cubestack
spec:
    display:
        name: Resource Overview
        description: 'Resource Overview: node CPU, memory and RDMA usage with per-GPU temperature, power and utilization'
    variables:
        -
            kind: ListVariable
            spec:
                display:
                    name: node
                    hidden: false
                defaultValue: $__all
                allowAllValue: true
                allowMultiple: false
                customAllValue: .*
                sort: alphabetical-asc
                plugin:
                    kind: PrometheusLabelValuesVariable
                    spec:
                        datasource:
                            kind: PrometheusDatasource
                            name: prometheus-datasource
                        labelName: node
                        matchers:
                            - DCGM_FI_DEV_GPU_UTIL
                        name: node
        -
            kind: ListVariable
            spec:
                display:
                    name: gpu
                    hidden: false
                defaultValue: $__all
                allowAllValue: true
                allowMultiple: false
                customAllValue: .*
                sort: alphabetical-asc
                plugin:
                    kind: PrometheusLabelValuesVariable
                    spec:
                        datasource:
                            kind: PrometheusDatasource
                            name: prometheus-datasource
                        labelName: gpu
                        matchers: []
                name: gpu
    panels:
        '0':
            kind: Panel
            spec:
                display:
                    name: GPU Temperature
                plugin:
                    kind: TimeSeriesChart
                    spec: {}
                queries:
                    -
                        kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: DCGM_FI_DEV_GPU_TEMP{node=~"$node",gpu=~"$gpu"}
                                    seriesNameFormat: '{{node}} · GPU {{gpu}}'
        '1':
            kind: Panel
            spec:
                display:
                    name: GPU Avg. Temp
                plugin:
                    kind: GaugeChart
                    spec:
                        calculation: last
                queries:
                    -
                        kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: avg(DCGM_FI_DEV_GPU_TEMP{node=~"$node",gpu=~"$gpu"})
                                    seriesNameFormat: ''
        '2':
            kind: Panel
            spec:
                display:
                    name: GPU Power Usage
                plugin:
                    kind: TimeSeriesChart
                    spec: {}
                queries:
                    -
                        kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: DCGM_FI_DEV_POWER_USAGE{node=~"$node",gpu=~"$gpu"}
                                    seriesNameFormat: '{{node}} · GPU {{gpu}}'
        '3':
            kind: Panel
            spec:
                display:
                    name: GPU Power Total
                plugin:
                    kind: GaugeChart
                    spec:
                        calculation: last
                queries:
                    -
                        kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: sum(DCGM_FI_DEV_POWER_USAGE{node=~"$node",gpu=~"$gpu"})
                                    seriesNameFormat: ''
        '6':
            kind: Panel
            spec:
                display:
                    name: GPU Utilization
                plugin:
                    kind: TimeSeriesChart
                    spec: {}
                queries:
                    -
                        kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: DCGM_FI_DEV_GPU_UTIL{node=~"$node",gpu=~"$gpu"}
                                    seriesNameFormat: '{{node}} · GPU {{gpu}}'
        '10':
            kind: Panel
            spec:
                display:
                    name: CPU Usage
                    description: '@hide-when-specific:gpu node CPU usage (hidden when a single GPU is selected)'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: list
                            position: bottom
                queries:
                    -
                        kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: node_cpu_usage{node=~"$node"}
                                    seriesNameFormat: '{{node}}'
        '11':
            kind: Panel
            spec:
                display:
                    name: GPU Usage
                    description: '@hide-when-specific:gpu node GPU usage (hidden when a single GPU is selected)'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: list
                            position: bottom
                queries:
                    -
                        kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: avg by (node) (DCGM_FI_DEV_GPU_UTIL{node=~"$node",gpu=~"$gpu"})
                                    seriesNameFormat: '{{node}}'
        '12':
            kind: Panel
            spec:
                display:
                    name: Memory Usage
                    description: '@hide-when-specific:gpu node memory usage (hidden when a single GPU is selected)'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: list
                            position: bottom
                queries:
                    -
                        kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: node_memory_usage{node=~"$node"}
                                    seriesNameFormat: '{{node}}'
        '13':
            kind: Panel
            spec:
                display:
                    name: RDMA Usage
                    description: '@hide-when-specific:gpu node RDMA usage (hidden when a single GPU is selected)'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: list
                            position: bottom
                queries:
                    -
                        kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: rdma_usage{node=~"$node"}
                                    seriesNameFormat: '{{node}}'
    layouts:
        -
            kind: Grid
            spec:
                items:
                    -
                        x: 0
                        'y': 0
                        width: 12
                        height: 8
                        content:
                            $ref: '#/spec/panels/10'
                    -
                        x: 12
                        'y': 0
                        width: 12
                        height: 8
                        content:
                            $ref: '#/spec/panels/11'
                    -
                        x: 0
                        'y': 8
                        width: 12
                        height: 8
                        content:
                            $ref: '#/spec/panels/12'
                    -
                        x: 12
                        'y': 8
                        width: 12
                        height: 8
                        content:
                            $ref: '#/spec/panels/13'
                    -
                        x: 0
                        'y': 16
                        width: 12
                        height: 8
                        content:
                            $ref: '#/spec/panels/6'
                    -
                        x: 12
                        'y': 16
                        width: 12
                        height: 8
                        content:
                            $ref: '#/spec/panels/0'
                    -
                        x: 0
                        'y': 24
                        width: 12
                        height: 8
                        content:
                            $ref: '#/spec/panels/1'
                    -
                        x: 12
                        'y': 24
                        width: 12
                        height: 8
                        content:
                            $ref: '#/spec/panels/2'
                    -
                        x: 0
                        'y': 32
                        width: 12
                        height: 8
                        content:
                            $ref: '#/spec/panels/3'
    duration: 1h
