apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
    name: inference-service-dashboard
    namespace: monitoring
spec:
    config:
        display:
            name: Inference Service
            description: "Inference Service: request latency, throughput, queuing and cache hits"
        variables:
        -   kind: ListVariable
            spec:
                display:
                    name: Service
                    hidden: false
                defaultValue: $__all
                allowAllValue: true
                allowMultiple: false
                customAllValue: .*
                plugin:
                    kind: PrometheusLabelValuesVariable
                    spec:
                        datasource:
                            kind: PrometheusDatasource
                            name: prometheus-datasource
                        labelName: inference_service
                        matchers:
                        -   cubestack_inference_requests_running:sum
                name: inference_service
        -   kind: ListVariable
            spec:
                # The model is implied by the selected inference service (each
                # service serves exactly one model), so it is resolved in the
                # background instead of shown as a dropdown; the island renders its
                # value as read-only text beside the service picker.
                display:
                    name: model
                    hidden: true
                allowAllValue: false
                allowMultiple: false
                plugin:
                    kind: PrometheusLabelValuesVariable
                    spec:
                        datasource:
                            kind: PrometheusDatasource
                            name: prometheus-datasource
                        labelName: gen_ai_request_model
                        matchers:
                        -   cubestack_inference_request_duration_seconds:p50_rate5m
                name: model_name
        panels:
            "0":
                kind: Panel
                spec:
                    display:
                        name: End-to-End Request Latency
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: cubestack_inference_request_duration_seconds:p99_rate5m{gen_ai_request_model=~"$model_name"}
                                    seriesNameFormat: P99
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: cubestack_inference_request_duration_seconds:p95_rate5m{gen_ai_request_model=~"$model_name"}
                                    seriesNameFormat: P95
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: cubestack_inference_request_duration_seconds:p50_rate5m{gen_ai_request_model=~"$model_name"}
                                    seriesNameFormat: P50
            "2":
                kind: Panel
                spec:
                    display:
                        name: Time-To-First-Token Latency
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: cubestack_inference_time_to_first_token_seconds:p99_rate5m{gen_ai_request_model=~"$model_name"}
                                    seriesNameFormat: P99
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: cubestack_inference_time_to_first_token_seconds:p95_rate5m{gen_ai_request_model=~"$model_name"}
                                    seriesNameFormat: P95
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: cubestack_inference_time_to_first_token_seconds:p50_rate5m{gen_ai_request_model=~"$model_name"}
                                    seriesNameFormat: P50
            "4":
                kind: Panel
                spec:
                    display:
                        name: Num Running Requests
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: cubestack_inference_requests_running:sum{inference_service=~"$inference_service"}
                                    seriesNameFormat: '{{inference_service}}'
            "5":
                kind: Panel
                spec:
                    display:
                        name: Token Generation Throughput (Tokens / S)
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: cubestack_inference_generation_tokens:rate5m{gen_ai_request_model=~"$model_name"}
                                    seriesNameFormat: '{{gen_ai_request_model}}'
            "6":
                kind: Panel
                spec:
                    display:
                        name: Cache Hit Rate
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: cubestack_inference_cache_hit_ratio:avg{inference_service=~"$inference_service"}
                                    seriesNameFormat: '{{inference_service}}'
            "7":
                kind: Panel
                spec:
                    display:
                        name: Number Queued Requests
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: cubestack_inference_requests_waiting:sum{inference_service=~"$inference_service"}
                                    seriesNameFormat: '{{inference_service}}'
        layouts:
        -   kind: Grid
            spec:
                items:
                -   x: 0
                    "y": 0
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/0'
                -   x: 12
                    "y": 0
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/2'
                -   x: 0
                    "y": 8
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/4'
                -   x: 12
                    "y": 8
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/5'
                -   x: 0
                    "y": 16
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/6'
                -   x: 12
                    "y": 16
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/7'
        duration: 1h
