apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
    name: inference-service-dashboard
    namespace: monitoring
spec:
    config:
        display:
            name: Inference Service
            description: "Inference Service: request latency, throughput, queuing and cache hits"
        variables:
        -   kind: ListVariable
            spec:
                display:
                    name: instance
                    hidden: false
                defaultValue: $__all
                allowAllValue: true
                allowMultiple: false
                customAllValue: .*
                plugin:
                    kind: PrometheusLabelValuesVariable
                    spec:
                        datasource:
                            kind: PrometheusDatasource
                            name: prometheus-datasource
                        labelName: instance
                        matchers: []
                name: instance
        -   kind: ListVariable
            spec:
                # The model is implied by the selected instance (each inference
                # service serves exactly one model), so it is resolved in the
                # background instead of shown as a dropdown; the island renders its
                # value as read-only text beside the instance picker.
                display:
                    name: model
                    hidden: true
                allowAllValue: false
                allowMultiple: false
                plugin:
                    kind: PrometheusLabelValuesVariable
                    spec:
                        datasource:
                            kind: PrometheusDatasource
                            name: prometheus-datasource
                        labelName: model_name
                        matchers:
                        -   'sglang_num_running_reqs{instance=~"$instance"}'
                name: model_name
        panels:
            "0":
                kind: Panel
                spec:
                    display:
                        name: End-to-End Request Latency
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: histogram_quantile(0.99, sum by (le) (rate(sglang_e2e_request_latency_seconds_bucket[$__rate_interval])))
                                    seriesNameFormat: P99
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: histogram_quantile(0.9, sum by (le) (rate(sglang_e2e_request_latency_seconds_bucket[$__rate_interval])))
                                    seriesNameFormat: P90
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: histogram_quantile(0.5, sum by (le) (rate(sglang_e2e_request_latency_seconds_bucket[$__rate_interval])))
                                    seriesNameFormat: P50
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: avg(rate(sglang_e2e_request_latency_seconds_sum[$__rate_interval])
                                        /  rate(sglang_e2e_request_latency_seconds_count[$__rate_interval]))
                                    seriesNameFormat: Avg
            "1":
                kind: Panel
                spec:
                    display:
                        name: End-to-End Request Latency(s) Heatmap
                    plugin:
                        kind: HeatMapChart
                        spec:
                            logBase: 10
                            showVisualMap: true
                            yAxisFormat:
                                decimalPlaces: 2
                                unit: decimal
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: sglang_e2e_request_latency_seconds{model_name=~"$model_name"}
                                    seriesNameFormat: latency
            "2":
                kind: Panel
                spec:
                    display:
                        name: Time-To-First-Token Latency
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: histogram_quantile(0.99, sum by (le) (rate(sglang_time_to_first_token_seconds_bucket[$__rate_interval])))
                                    seriesNameFormat: P99
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: histogram_quantile(0.9, sum by (le) (rate(sglang_time_to_first_token_seconds_bucket[$__rate_interval])))
                                    seriesNameFormat: P90
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: histogram_quantile(0.5, sum by (le) (rate(sglang_time_to_first_token_seconds_bucket[$__rate_interval])))
                                    seriesNameFormat: P50
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: avg(rate(sglang_time_to_first_token_seconds_sum[$__rate_interval])
                                        /  rate(sglang_time_to_first_token_seconds_count[$__rate_interval]))
                                    seriesNameFormat: Avg
            "3":
                kind: Panel
                spec:
                    display:
                        name: Time-To-First-Token Seconds Heatmap
                    plugin:
                        kind: HeatMapChart
                        spec:
                            logBase: 10
                            showVisualMap: true
                            yAxisFormat:
                                decimalPlaces: 2
                                unit: decimal
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: sglang_time_to_first_token_seconds{model_name=~"$model_name"}
                                    seriesNameFormat: latency
            "4":
                kind: Panel
                spec:
                    display:
                        name: Num Running Requests
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    minStep: ''
                                    query: sglang_num_running_reqs
                                    seriesNameFormat: '{{instance}}'
            "5":
                kind: Panel
                spec:
                    display:
                        name: Token Generation Throughput (Tokens / S)
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: sglang_gen_throughput
                                    seriesNameFormat: '{{instance}}'
            "6":
                kind: Panel
                spec:
                    display:
                        name: Cache Hit Rate
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: sglang_cache_hit_rate
                                    seriesNameFormat: '{{instance}}'
            "7":
                kind: Panel
                spec:
                    display:
                        name: Number Queued Requests
                    plugin:
                        kind: TimeSeriesChart
                        spec:
                            legend:
                                mode: list
                                position: bottom
                            visual:
                                areaOpacity: 0
                                connectNulls: false
                                display: line
                                lineWidth: 1
                    queries:
                    -   kind: TimeSeriesQuery
                        spec:
                            plugin:
                                kind: PrometheusTimeSeriesQuery
                                spec:
                                    datasource:
                                        kind: PrometheusDatasource
                                        name: prometheus-datasource
                                    query: sglang_num_queue_reqs
                                    seriesNameFormat: '{{instance}}'
        layouts:
        -   kind: Grid
            spec:
                items:
                -   x: 0
                    "y": 0
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/0'
                -   x: 12
                    "y": 0
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/1'
                -   x: 0
                    "y": 8
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/2'
                -   x: 12
                    "y": 8
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/3'
                -   x: 0
                    "y": 16
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/4'
                -   x: 12
                    "y": 16
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/5'
                -   x: 0
                    "y": 24
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/6'
                -   x: 12
                    "y": 24
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/7'
        duration: 1h
