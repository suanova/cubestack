{{- if and .Values.scrapeConfigs.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1alpha1") }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: {{ include "cubestack-bmc-exporter.fullname" . }}-idrac-exporter
  labels:
    {{- include "cubestack-bmc-exporter.labels" . | nindent 4 }}
    # Must match the stack's scrapeConfigSelector (default: its helm release name).
    release: {{ .Values.scrapeConfigs.releaseLabel }}
spec:
  metricsPath: {{ .Values.scrapeConfigs.idrac.metricsPath }}
  scrapeInterval: {{ .Values.scrapeConfigs.interval }}
  scrapeTimeout: {{ .Values.scrapeConfigs.idrac.timeout }}
  staticConfigs:
    {{- range .Values.bmc.hosts }}
    - targets:
        - {{ include "cubestack-bmc-exporter.fullname" $ }}-idrac-exporter.{{ $.Release.Namespace }}.svc:9348
      labels:
        job: idrac-exporter
        # __param_<name> labels become URL query parameters at scrape time.
        __param_target: {{ . }}
    {{- end }}
  relabelings:
    # Make instance the BMC IP so metrics from different BMCs are distinguishable.
    - sourceLabels: [__param_target]
      targetLabel: instance
{{- end }}
