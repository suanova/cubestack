apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cubestack-bmc-exporter.fullname" . }}-bmc-oem-exporter
  labels:
    {{- include "cubestack-bmc-exporter.componentLabels" (dict "component" "bmc-oem-exporter" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cubestack-bmc-exporter.componentLabels" (dict "component" "bmc-oem-exporter" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cubestack-bmc-exporter.componentLabels" (dict "component" "bmc-oem-exporter" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 8 }}
    spec:
      {{- with .Values.bmcOemExporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bmcOemExporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bmc-oem-exporter
          image: "{{ .Values.bmcOemExporter.image.repository }}:{{ .Values.bmcOemExporter.image.tag }}"
          imagePullPolicy: {{ .Values.bmcOemExporter.image.pullPolicy }}
          env:
            - name: BMC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "cubestack-bmc-exporter.fullname" . }}-bmc-credentials
                  key: username
            - name: BMC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cubestack-bmc-exporter.fullname" . }}-bmc-credentials
                  key: password
          ports:
            - name: metrics
              containerPort: 9622
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
